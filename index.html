<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẠI TIỆC SHIN XÌ HƠI! - GỌI TÊN HỌC SINH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chilanka&family=Comfortaa:wght@700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #222;
            font-family: 'Comfortaa', 'Comic Sans MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung Game Tỷ Lệ 16:9 giống hệt ảnh mẫu */
        #game-container {
            width: 1024px;
            height: 576px;
            background: #bbf2be; /* Nền xanh nhạt của lớp học */
            border: 8px solid #4a3728;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Lớp nền trong phòng lớp học */
        .room-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #d8f5d3; /* màu xanh lớp học */
            z-index: 1;
        }

        /* Cửa sổ ban đêm giống trong ảnh */
        .window-frame {
            position: absolute;
            top: 60px;
            left: 180px;
            width: 250px;
            height: 200px;
            background: #191c3a;
            border: 12px solid #ff9ebb; /* Khung cửa sổ hồng */
            border-bottom: 20px solid #ff9ebb;
            border-radius: 20px 20px 0 0;
            z-index: 2;
        }
        .window-pane {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        .window-pane::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: #ff9ebb;
            top: 50%;
            transform: translateY(-50%);
        }
        .window-pane::after {
            content: '';
            position: absolute;
            height: 100%;
            width: 8px;
            background: #ff9ebb;
            left: 50%;
            transform: translateX(-50%);
        }
        .crescent-moon {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 12px 12px 0 0 #fbe25d;
        }

        /* Bể cá bên trái */
        .fish-tank {
            position: absolute;
            bottom: 120px;
            left: 30px;
            width: 170px;
            height: 110px;
            background: linear-gradient(180deg, #96e0ff 0%, #30a9e3 100%);
            border: 6px solid #afafaf;
            border-radius: 10px;
            z-index: 2;
            opacity: 0.9;
        }
        .fish-tank::before {
            content: '🐠 🌿';
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 24px;
        }

        /* Kệ đồ chơi, lều bên phải */
        .corner-toys {
            position: absolute;
            bottom: 110px;
            right: 15px;
            width: 120px;
            height: 120px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='60' width='80' height='40' fill='%23d4a373'/><circle cx='30' cy='45' r='15' fill='%23ffb703'/><polygon points='70,30 50,60 90,60' fill='%23fb8500'/></svg>") no-repeat;
            z-index: 2;
        }

        /* Tiêu đề GAME - Giao diện trên cùng */
        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: #ffffff;
            border-bottom: 4px solid #ffccd5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            font-size: 40px;
        }
        .brand-text h1 {
            margin: 0;
            font-size: 26px;
            color: #d62246;
            text-shadow: 2px 2px 0px #ffe5ec;
            font-family: 'Comfortaa', sans-serif;
        }
        .brand-text p {
            margin: 0;
            font-size: 11px;
            color: #777;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .badge {
            background: #f7f7f7;
            border: 3px solid #ffccd5;
            border-radius: 15px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: bold;
            color: #4a3728;
            box-shadow: 0 4px 0 #ffccd5;
        }
        .badge span {
            color: #d62246;
            font-size: 16px;
        }

        /* Thanh thông báo chạy trốn màu vàng nhạt */
        .alert-bar {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #e2f7cb;
            border: 3px solid #a3cf62;
            border-radius: 30px;
            padding: 8px 40px;
            font-size: 13px;
            font-weight: bold;
            color: #2b540f;
            z-index: 5;
            box-shadow: 0 4px 0 #a3cf62;
            white-space: nowrap;
        }

        /* --------------------------------- */
        /* HÌNH ẢNH NHÂN VẬT SHIN CẬU BÉ BÚT CHÌ */
        /* --------------------------------- */
        .shin-chan {
            position: absolute;
            bottom: 120px;
            left: 62%;
            transform: translateX(-50%);
            width: 140px;
            height: 150px;
            z-index: 6;
            cursor: pointer;
        }
        .shin-graphics {
            width: 100%;
            height: 100%;
        }

        /* Nhãn tên cho nhân vật */
        .char-label {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffeb3b;
            border: 2px solid #5c4308;
            border-radius: 12px;
            padding: 2px 14px;
            font-size: 11px;
            font-weight: bold;
            color: #4a2f00;
            white-space: nowrap;
            box-shadow: 1px 2px 0px rgba(0,0,0,0.2);
            z-index: 8;
        }

        /* --------------------------------- */
        /* HỌC SINH CHẠY LOẠN / NGẤT XỈU     */
        /* --------------------------------- */
        .playground {
            position: absolute;
            bottom: 85px;
            left: 0;
            width: 100%;
            height: 310px;
            z-index: 4;
        }

        .student {
            position: absolute;
            width: 80px;
            height: 100px;
            transition: left 0.8s linear, bottom 0.8s linear, transform 0.4s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
        }

        .student-body {
            width: 70px;
            height: 70px;
            transition: transform 0.3s;
        }

        /* Trạng thái ngất xỉu nằm bẹp dưới đất */
        .student.fainted {
            transform: rotate(85deg) translateY(15px);
        }
        .student.fainted .student-body {
            filter: grayscale(20%) sepia(20%);
        }

        .student-label {
            background: #ffffff;
            border: 2px solid #4a3728;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            margin-top: 4px;
            box-shadow: 0 2px 0px #4a3728;
            z-index: 5;
        }

        .student.fainted .student-label {
            background: #ffe3e3;
            border-color: #a30000;
            color: #a30000;
        }

        /* Bóng khí hoảng loạn / ngất xỉu */
        .speech-bubble {
            position: absolute;
            top: -30px;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 2px 6px;
            font-size: 9px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            box-shadow: 1px 2px 0px rgba(0,0,0,0.15);
            animation: bounce-speech 1s infinite alternate;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent;
        }

        /* --------------------------------- */
        /* HIỆU ỨNG THẢ RẤM VÀ KHÓI          */
        /* --------------------------------- */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .fart-explosion {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #4CAF50;
            text-shadow: 3px 3px 0px #fff, -2px -2px 0px #2e7d32;
            z-index: 100;
            pointer-events: none;
            animation: text-expand 0.8s forwards ease-out;
            white-space: nowrap;
        }

        /* --------------------------------- */
        /* GIAO DIỆN ĐIỀU KHIỂN DƯỚI CÙNG   */
        /* --------------------------------- */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: #ffffff;
            border-top: 4px solid #ffccd5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            z-index: 10;
        }

        .control-slide {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 13px;
            color: #4a3728;
        }
        .num-preview {
            background: #fff;
            border: 2px solid #ff5e62;
            color: #d62246;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 18px;
        }

        .btn-play {
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 0 #56038a;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-play:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-reset {
            background: #fdfdfd;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
        }

        #setup-ds-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }

        /* Popup nhập danh sách */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-body {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            border: 5px solid #4a3728;
        }
        textarea {
            width: 100%;
            height: 140px;
            margin: 15px 0;
            padding: 10px;
            font-family: inherit;
        }

        /* ------------------------- */
        /* HIỆU ỨNG ĐỘNG             */
        /* ------------------------- */
        @keyframes bounce-speech {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }
        @keyframes text-expand {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 0; translateY(-40px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="room-bg"></div>
    <div class="window-frame">
        <div class="crescent-moon"></div>
        <div class="window-pane"></div>
    </div>
    <div class="fish-tank"></div>
    <div class="corner-toys"></div>

    <!-- Tiêu đề trên -->
    <div class="game-header">
        <div class="brand-title">
            <span class="brand-logo">🏫</span>
            <div class="brand-text">
                <h1>ĐẠI TIỆC SHIN XÌ HƠI!</h1>
                <p>Cứ tớ thả rắm... là các bạn chạy toán loạn xỉu bẹp!</p>
            </div>
            <button id="setup-ds-btn" onclick="togglePopup(true)">📝 Đổi Danh Sách HS</button>
        </div>
        <div class="game-stats">
            <div class="badge">ĐANG CHƠI: <span id="active-count">10</span></div>
            <div class="badge">ĐÃ XỈU: <span id="fainted-count">0</span></div>
            <button class="sound-icon" onclick="switchSound()" style="background:none; border:none; font-size:24px; cursor:pointer;">🔊</button>
        </div>
    </div>

    <!-- Thông báo banner -->
    <div class="alert-bar">🏃‍♂️ CHẠY MAU! CÁC BẠN ĐANG CHẠY TRỐN KHẮP PHÒNG!</div>

    <!-- Màn Canvas vẽ khói rắm bay mù mịt -->
    <canvas id="particle-canvas"></canvas>

    <!-- Sân chơi động -->
    <div class="playground" id="playground">
        
        <!-- NHÂN VẬT SHIN CHỔNG MÔNG (bằng Vector SVG chi tiết y hệt mẫu) -->
        <div class="shin-chan" id="shin-boy" onclick="shinFart()">
            <svg class="shin-graphics" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Chân và Quần Pijama của Shin -->
                <ellipse cx="38" cy="115" rx="14" ry="7" fill="#fbc02d" stroke="#3e2723" stroke-width="2.5"/> <!-- Chân trái -->
                <ellipse cx="62" cy="115" rx="14" ry="7" fill="#fbc02d" stroke="#3e2723" stroke-width="2.5"/> <!-- Chân phải -->
                <path d="M 28,95 C 28,110 72,110 72,95 Z" fill="#2196f3" stroke="#3e2723" stroke-width="2.5" /> <!-- Quần pijama màu xanh -->
                <!-- Họa tiết quần: Tròn vàng, Tam giác vàng -->
                <circle cx="38" cy="100" r="4" fill="#ffeb3b" />
                <polygon points="58,98 64,98 61,104" fill="#ffeb3b" />
                <circle cx="48" cy="105" r="3.5" fill="#ffeb3b" />

                <!-- Mông chổng về phía bên trái -->
                <path d="M 20,82 C 10,82 8,96 18,102 C 24,105 32,98 32,88 Z" fill="#ffcc80" stroke="#3e2723" stroke-width="2.5" /> <!-- Quần xệ để hở mông dở khóc dở cười dặc trưng -->
                <path d="M 17,90 C 13,90 12,96 17,98 Z" fill="#ffab91" /> <!-- Kẻ rãnh mông chuẩn -->

                <!-- Thân mình & áo pijama dài tay -->
                <path d="M 32,75 Q 40,65 52,70 Q 70,72 72,90 Q 70,105 45,100" fill="#2196f3" stroke="#3e2723" stroke-width="2.5" />
                <!-- Họa tiết áo pijama -->
                <circle cx="45" cy="80" r="4" fill="#ffeb3b" />
                <polygon points="60,74 65,74 62,80" fill="#ffeb3b" />
                <circle cx="55" cy="88" r="3.5" fill="#ffeb3b" />

                <!-- Đầu to đặc trưng tròn xoe, tai dẹt của Shin-chan -->
                <path d="M 45,40 C 35,40 32,55 42,65 Q 52,70 65,65 C 78,55 75,38 60,35 C 54,32 48,35 45,40 Z" fill="#ffcc80" stroke="#3e2723" stroke-width="3" />
                <!-- Kiểu tóc 3 chỏm, lông mày sâu róm siêu dày đặc trưng -->
                <path d="M 40,36 Q 48,30 58,32 Q 52,28 40,36" fill="#000" /> <!-- Tóc -->
                <path d="M 42,43 Q 48,39 52,43" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none" /> <!-- Lông mày trái dày -->
                <path d="M 58,41 Q 64,39 68,43" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none" /> <!-- Lông mày phải dày -->

                <!-- Mắt lim dim, nụ cười hớn hở chọc ghẹo -->
                <ellipse cx="48" cy="48" rx="4" ry="2" fill="#000" /> <!-- Mắt khép nhắm nheo -->
                <ellipse cx="64" cy="48" rx="4" ry="2" fill="#000" />
                <path d="M 52,58 Q 58,62 62,56" stroke="#3e2723" stroke-width="2" fill="none" /> <!-- Miệng cười tinh nghịch -->
                <ellipse cx="73" cy="54" rx="5" ry="7" fill="#ffcc80" stroke="#3e2723" stroke-width="2" /> <!-- Tai -->

                <!-- Cánh tay và đĩa bánh dơ lên như ảnh gốc -->
                <path d="M 68,80 Q 80,82 82,75 Q 84,70 76,73" fill="#2196f3" stroke="#3e2723" stroke-width="2.2" /> <!-- Tay cầm đĩa bánh -->
                <ellipse cx="85" cy="73" rx="10" ry="3" fill="#fff" stroke="#000" stroke-width="1.5" /> <!-- Đĩa -->
                <circle cx="85" cy="71" r="5" fill="#795548" /> <!-- Bánh gato nhỏ -->

                <!-- Chi tiết ranh mãnh tay trái vuốt mặt -->
                <path d="M 42,64 Q 38,72 32,70" stroke="#3e2723" stroke-width="2" fill="none"/>
            </svg>
            <div class="char-label">SHIN 🎂</div>
        </div>

    </div>

    <!-- Thanh Footer dưới cùng -->
    <div class="footer">
        <div class="control-slide">
            <span>SỐ BẠN BỊ NGẤT MỖI LƯỢT:</span>
            <input type="range" id="quantity-faint" min="1" max="5" value="3" oninput="document.getElementById('display-qty').innerText = this.value">
            <span class="num-preview" id="display-qty">3</span>
        </div>

        <button class="btn-play" onclick="shinFart()">
            🤢 ĐANG CHẠY TRỐN... (THẢ RẮM!) 💨
        </button>

        <button class="btn-reset" onclick="resetPlayground()">🔄 Gọi lại từ đầu</button>
    </div>
</div>

<!-- Modal để thay đổi danh sách học sinh -->
<div class="modal" id="student-modal">
    <div class="modal-body">
        <h3>Lớp Học Của Cô Ngân</h3>
        <p>Nhập tên từng bạn học sinh vào đây (mỗi dòng 1 bạn):</p>
        <textarea id="list-input">Vy
Hoàng Minh Châu
Tạ Gia Hân
Phan Đức Phúc
Hoàng Ngân
Trịnh Thùy Linh
Vũ Hoàng Long
Kaon, Masao
Ngọc Diệp
Hồng Đạt</textarea>
        <br>
        <button class="btn-play" style="font-size:14px; padding: 10px 20px;" onclick="saveStudentList()">Đồng Ý & Bắt Đầu</button>
    </div>
</div>

<script>
    let playSound = true;
    let studentsData = [];
    const playground = document.getElementById('playground');
    const modal = document.getElementById('student-modal');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    // Chỉnh kích thước canvas cho các hạt rắm
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth || 1024;
        canvas.height = canvas.offsetHeight || 576;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    // Dữ liệu hình ảnh SVG học sinh pijama chạy nhảy và ngất xỉu
    const studentSkins = [
        // Bé gái mặc đồ hồng (Vy)
        `<svg viewBox="0 0 80 100" width="100%" height="100%">
            <ellipse cx="40" cy="88" rx="10" ry="5" fill="#f06292" stroke="#000" stroke-width="2"/>
            <ellipse cx="25" cy="88" rx="10" ry="5" fill="#f06292" stroke="#000" stroke-width="2"/>
            <path d="M 22,65 Q 40,55 58,65 L 54,88 L 26,88 Z" fill="#f48fb1" stroke="#000" stroke-width="2"/>
            <circle cx="28" cy="70" r="3" fill="#fff"/><circle cx="52" cy="70" r="3" fill="#fff"/>
            <circle cx="40" cy="38" r="22" fill="#ffcc80" stroke="#000" stroke-width="2.5"/>
            <path d="M 18,30 Q 30,12 45,22 Q 62,15 62,32" stroke="#000" stroke-width="4" fill="none"/>
            <circle cx="18" cy="24" r="7" fill="#ff80ab" stroke="#000" stroke-width="1.5"/>
            <circle cx="62" cy="24" r="7" fill="#ff80ab" stroke="#000" stroke-width="1.5"/>
            <ellipse class="eye-left" cx="30" cy="36" rx="4" ry="4" fill="#000"/>
            <ellipse class="eye-right" cx="50" cy="36" rx="4" ry="4" fill="#000"/>
            <path d="M 35,46 Q 40,51 45,46" stroke="#000" stroke-width="2" fill="none"/>
         </svg>`,
        // Bé trai mặc đồ vàng họa tiết (Phan Đức Phúc)
        `<svg viewBox="0 0 80 100" width="100%" height="100%">
            <ellipse cx="40" cy="88" rx="10" ry="5" fill="#fbc02d" stroke="#000" stroke-width="2"/>
            <ellipse cx="25" cy="88" rx="10" ry="5" fill="#fbc02d" stroke="#000" stroke-width="2"/>
            <path d="M 22,65 Q 40,55 58,65 L 54,88 L 26,88 Z" fill="#fff59d" stroke="#000" stroke-width="2"/>
            <circle cx="30" cy="70" r="3.5" fill="#f57c00"/><circle cx="50" cy="75" r="2.5" fill="#f57c00"/>
            <circle cx="40" cy="38" r="20" fill="#ffcc80" stroke="#000" stroke-width="2.5"/>
            <path d="M 20,28 Q 40,15 60,28" stroke="#3e2723" stroke-width="5" fill="none"/>
            <ellipse class="eye-left" cx="30" cy="38" rx="4" ry="4" fill="#000"/>
            <ellipse class="eye-right" cx="50" cy="38" rx="4" ry="4" fill="#000"/>
            <path d="M 33,48 Q 40,54 47,48" stroke="#3e2723" stroke-width="2" fill="none"/>
         </svg>`,
        // Học sinh mặc pijama xanh dương chấm bi (Hoàng Minh Châu)
        `<svg viewBox="0 0 80 100" width="100%" height="100%">
            <ellipse cx="40" cy="88" rx="9" ry="5" fill="#1976d2" stroke="#000" stroke-width="2"/>
            <ellipse cx="26" cy="88" rx="9" ry="5" fill="#1976d2" stroke="#000" stroke-width="2"/>
            <path d="M 22,65 Q 40,55 58,65 L 54,88 L 26,88 Z" fill="#64b5f6" stroke="#000" stroke-width="2"/>
            <circle cx="32" cy="72" r="3" fill="#e0f2f1"/><circle cx="48" cy="78" r="3" fill="#e0f2f1"/>
            <circle cx="40" cy="40" r="21" fill="#ffe0b2" stroke="#000" stroke-width="2.5"/>
            <path d="M 18,24 Q 40,10 62,24" stroke="#000" stroke-width="6" fill="none"/>
            <ellipse class="eye-left" cx="30" cy="40" rx="4" ry="4" fill="#000"/>
            <ellipse class="eye-right" cx="50" cy="40" rx="4" ry="4" fill="#000"/>
            <path d="M 34,50 Q 40,43 46,50" stroke="#000" stroke-width="2" fill="none"/>
         </svg>`
    ];

    function switchSound() {
        playSound = !playSound;
        document.querySelector('.sound-icon').innerText = playSound ? "🔊" : "🔇";
    }

    // Hiệu ứng âm thanh giả lập bằng Web Audio API
    function fartSound() {
        if (!playSound) return;
        const ctxAud = new (window.AudioContext || window.webkitAudioContext)();
        
        let osc = ctxAud.createOscillator();
        let gain = ctxAud.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctxAud.currentTime);
        // Tần số giảm nhanh tạo âm xì hơi rẹt rẹt
        osc.frequency.linearRampToValueAtTime(30, ctxAud.currentTime + 0.6);
        
        gain.gain.setValueAtTime(0.6, ctxAud.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctxAud.currentTime + 0.7);
        
        osc.connect(gain);
        gain.connect(ctxAud.destination);
        osc.start();
        osc.stop(ctxAud.currentTime + 0.7);
    }

    function faintSound() {
        if (!playSound) return;
        const ctxAud = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctxAud.createOscillator();
        let gain = ctxAud.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, ctxAud.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctxAud.currentTime + 0.6);
        
        gain.gain.setValueAtTime(0.4, ctxAud.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctxAud.currentTime + 0.6);
        
        osc.connect(gain);
        gain.connect(ctxAud.destination);
        osc.start();
        osc.stop(ctxAud.currentTime + 0.6);
    }

    // Quản lý hạt rắm
    let particles = [];
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.7) * 4 - 2; // Bay mạnh về bên trái từ mông Shin
            this.vy = (Math.random() - 0.5) * 3;
            this.alpha = 1;
            this.size = Math.random() * 20 + 15;
            this.color = Math.random() > 0.5 ? 'rgba(139, 195, 74, ' : 'rgba(205, 220, 57, ';
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.012;
            if (this.size < 60) this.size += 0.5;
        }
        draw() {
            ctx.fillStyle = this.color + this.alpha + ')';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            } else {
                particles[i].draw();
            }
        }
        requestAnimationFrame(animateParticles);
    }
    requestAnimationFrame(animateParticles);

    // Di chuyển các học sinh tự do
    let movingTimer;
    function beginChaosMoving() {
        if(movingTimer) clearInterval(movingTimer);
        movingTimer = setInterval(() => {
            const kids = playground.querySelectorAll('.student.running');
            kids.forEach(kid => {
                let currentLeft = parseFloat(kid.style.left);
                let currentBottom = parseFloat(kid.style.bottom);

                // Các bé hoảng sợ chạy nhảy tứ phương tản mạn
                let dx = (Math.random() - 0.5) * 160;
                let dy = (Math.random() - 0.5) * 60;

                let targetX = Math.max(30, Math.min(880, currentLeft + dx));
                let targetY = Math.max(20, Math.min(180, currentBottom + dy));

                // Khoảng cách an toàn không đứng đè lên Shin ở giữa phải
                if(targetX > 550 && targetX < 730) {
                    targetX -= 150;
                }

                kid.style.left = `${targetX}px`;
                kid.style.bottom = `${targetY}px`;

                // Ngẫu nhiên hiển thị kêu cứu
                const speech = kid.querySelector('.speech-bubble');
                if(Math.random() > 0.7) {
                    speech.innerText = "🏃‍♂️ CHẠY MAU!";
                    speech.style.display = 'block';
                    setTimeout(() => { if(!kid.classList.contains('fainted')) speech.style.display = 'none'; }, 1500);
                }
            });
        }, 1200);
    }

    // TẢ RẤM SHIN & CHỌN HỌC SINH NGẤT XỈU
    function shinFart() {
        fartSound();

        // Rung rinh Shin-chan chổng mông
        const shin = document.getElementById('shin-boy');
        shin.style.transform = 'translateX(-50%) scale(1.2) rotate(5deg)';
        setTimeout(() => {
            shin.style.transform = 'translateX(-50%) scale(1) rotate(0deg)';
        }, 200);

        // Nổ bùng mây chữ
        const fartExplosion = document.createElement('div');
        fartExplosion.className = 'fart-explosion';
        fartExplosion.style.left = '60%';
        fartExplosion.style.bottom = '200px';
        fartExplosion.innerHTML = "🤢 BỤP! XỲYYY! 💨";
        playground.appendChild(fartExplosion);
        setTimeout(() => fartExplosion.remove(), 800);

        // Sinh khói từ vùng mông Shin
        const shinRect = shin.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const startX = shinRect.left - containerRect.left + 30;
        const startY = shinRect.top - containerRect.top + 80;

        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                particles.push(new Particle(startX, startY));
            }, i * 8);
        }

        // Chọn học sinh bị dính ngất xỉu
        const activeKids = Array.from(playground.querySelectorAll('.student.running'));
        if (activeKids.length === 0) {
            alert("Các bạn học sinh đã ngất xỉu vì quá thối rồi! Vui lòng ấn 'Gọi lại từ đầu'!");
            return;
        }

        const countToFaint = parseInt(document.getElementById('quantity-faint').value);
        let actualToFaint = Math.min(countToFaint, activeKids.length);

        // Random xáo trộn để bốc tên
        const faintedSelection = activeKids.sort(() => 0.5 - Math.random()).slice(0, actualToFaint);

        faintedSelection.forEach((kid, idx) => {
            setTimeout(() => {
                kid.classList.remove('running');
                kid.classList.add('fainted');

                // Mắt thôi miên và ngả lăn ra đất
                const sprite = kid.querySelector('.student-body');
                
                // Thay thế tròng mắt bằng vòng xoáy thôi miên @@ 😵‍💫
                const eyeL = sprite.querySelector('.eye-left');
                const eyeR = sprite.querySelector('.eye-right');
                if(eyeL) {
                    eyeL.setAttribute('rx', '6');
                    eyeL.setAttribute('ry', '6');
                    eyeL.setAttribute('fill', 'none');
                    eyeL.setAttribute('stroke', '#000');
                    eyeL.setAttribute('stroke-width', '1.5');
                    eyeL.innerHTML = `<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>`;
                }
                if(eyeR) {
                    eyeR.setAttribute('rx', '6');
                    eyeR.setAttribute('ry', '6');
                    eyeR.setAttribute('fill', 'none');
                    eyeR.setAttribute('stroke', '#000');
                    eyeR.setAttribute('stroke-width', '1.5');
                    eyeR.innerHTML = `<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>`;
                }

                // Bong thoại ngất
                const speech = kid.querySelector('.speech-bubble');
                speech.innerHTML = "😵 Thúi quá... ngất xỉu!";
                speech.style.display = 'block';

                faintSound();
                updateCounts();
            }, idx * 450);
        });
    }

    function updateCounts() {
        const active = playground.querySelectorAll('.student.running').length;
        const fainted = playground.querySelectorAll('.student.fainted').length;
        document.getElementById('active-count').innerText = active;
        document.getElementById('fainted-count').innerText = fainted;
    }

    // Thiết lập lại toàn bộ sân chơi
    function initPlayground() {
        const existingKids = playground.querySelectorAll('.student');
        existingKids.forEach(k => k.remove());

        const input = document.getElementById('list-input').value;
        studentsData = input.split('\n').filter(name => name.trim() !== "");

        studentsData.forEach((name, index) => {
            const kid = document.createElement('div');
            kid.className = 'student running';
            kid.id = `stud-${index}`;

            // Chọn ngẫu nhiên mẫu hình SVG để đa dạng hóa
            const svgSkin = studentSkins[index % studentSkins.length];

            kid.innerHTML = `
                <div class="speech-bubble" style="display:none;"></div>
                <div class="student-body">${svgSkin}</div>
                <div class="student-label">${name}</div>
            `;

            // Xếp ngẫu nhiên tránh Shin
            let startX, startY;
            do {
                startX = Math.random() * 850 + 40;
                startY = Math.random() * 160 + 20;
            } while (startX > 550 && startX < 730);

            kid.style.left = `${startX}px`;
            kid.style.bottom = `${startY}px`;

            playground.appendChild(kid);
        });

        updateCounts();
        beginChaosMoving();
    }

    function togglePopup(show) {
        modal.style.display = show ? 'flex' : 'none';
    }

    function saveStudentList() {
        togglePopup(false);
        initPlayground();
    }

    function resetPlayground() {
        initPlayground();
    }

    // Khởi chạy
    window.onload = () => {
        initPlayground();
        resizeCanvas();
    };
</script>
