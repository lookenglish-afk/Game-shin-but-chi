<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐẠI TIỆC SHIN XÌ HƠI! - 3D GITHUB EDITION</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Mali:wght@700;900&display=swap');

  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

  body {
    background: #121318;
    font-family: 'Comfortaa', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* Khung chứa game chuẩn 16:9 */
  #game-app {
    width: 1060px;
    height: 596px;
    background: linear-gradient(180deg, #d8f5d3 0%, #b8e6b0 70%, #9cd892 100%);
    border: 8px solid #3d2616;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }

  /* Header trên cùng */
  .header-bar {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 74px;
    background: rgba(255, 255, 255, 0.96);
    border-bottom: 4px solid #ffccd5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 50;
  }
  .header-title-box h1 {
    font-size: 22px;
    color: #e63946;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title-box p {
    font-size: 11px;
    color: #666;
  }
  .header-badges {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .badge {
    background: #fff;
    border: 2px solid #ffb3c1;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: bold;
    color: #4a3427;
    box-shadow: 0 3px 0 #ffccd5;
  }
  .badge b { color: #d90429; font-size: 15px; }

  .btn-ui {
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
  }

  /* Băng rôn trạng thái */
  .status-banner {
    position: absolute;
    top: 86px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8bd;
    border: 3px solid #f4a261;
    border-radius: 30px;
    padding: 7px 32px;
    font-size: 13px;
    font-weight: bold;
    color: #4a2800;
    box-shadow: 0 4px 0 #e76f51;
    z-index: 40;
    white-space: nowrap;
  }

  /* Phòng ngủ ban đêm */
  .room-window {
    position: absolute; top: 88px; left: 115px; width: 215px; height: 185px;
    background: #141738; border: 10px solid #ffb5c5; border-bottom: 16px solid #ffb5c5; border-radius: 20px 20px 0 0; z-index: 2;
  }
  .room-window::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 6px; background: #ffb5c5; transform: translateY(-50%); }
  .room-window::after { content: ''; position: absolute; left: 50%; top: 0; width: 6px; height: 100%; background: #ffb5c5; transform: translateX(-50%); }
  .window-moon { position: absolute; top: 18px; right: 28px; width: 45px; height: 45px; border-radius: 50%; box-shadow: 10px 10px 0 0 #ffeb3b; }
  
  .aquarium {
    position: absolute; bottom: 125px; left: 35px; width: 165px; height: 105px;
    background: linear-gradient(180deg, rgba(162, 222, 255, 0.85) 0%, rgba(68, 172, 238, 0.92) 100%);
    border: 5px solid #dcdcdc; border-radius: 12px; z-index: 3; display: flex; justify-content: center; align-items: center; font-size: 26px;
  }
  .tent-shelter {
    position: absolute; bottom: 105px; right: 25px; width: 155px; height: 185px; background: #f7d070; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-left: 12px solid #dfa838; z-index: 3;
  }
  .tent-door {
    position: absolute; bottom: 0; left: 50px; width: 52px; height: 70px; background: #6e4719; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  /* Sân khấu */
  .room-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
  #smoke-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }

  /* Shin 3D chuẩn từ shin.png */
  .shin-wrapper {
    position: absolute; bottom: 110px; left: 580px; width: 150px; height: 165px; z-index: 25; pointer-events: auto; cursor: pointer;
  }
  .shin-img-3d {
    width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35));
    transition: transform 0.2s;
  }
  .shin-wrapper:hover .shin-img-3d { transform: scale(1.05); }

  @keyframes buttWiggle {
    0% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(8px) rotate(6deg); }
    50% { transform: translateX(-8px) rotate(-6deg); }
    75% { transform: translateX(6px) rotate(4deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }
  .shin-farting { animation: buttWiggle 0.35s infinite ease-in-out; }

  /* Chữ hoạt hình xì hơi */
  .fart-comic-text {
    position: absolute; bottom: 250px; left: 600px;
    font-family: 'Mali', cursive; font-size: 38px; font-weight: 900; color: #38b000;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 5px 5px 0 #1b4332;
    z-index: 60; pointer-events: none; animation: comicPop 0.9s forwards ease-out; white-space: nowrap;
  }
  @keyframes comicPop {
    0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    40% { transform: scale(1.3) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg) translateY(-40px); opacity: 0; }
  }

  /* Học sinh chạy trốn */
  .student-item {
    position: absolute; width: 95px; height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    transition: left 0.8s linear, bottom 0.8s linear; z-index: 18; pointer-events: auto;
  }
  .student-item.panic-mode { transition: left 0.38s linear, bottom 0.38s linear !important; }
  
  .student-box-div {
    width: 80px; height: 95px; background: #fffbe6; border: 3px solid #3d2616; border-radius: 12px;
    display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; color: #3d2616;
    box-shadow: 0 6px 12px rgba(0,0,0,0.25); position: relative; overflow: hidden;
  }
  .student-item.fainted { transform: rotate(86deg) translateY(24px) !important; z-index: 12 !important; }

  @keyframes runBounce {
    0% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-12px) rotate(6deg); }
    100% { transform: translateY(0) rotate(-6deg); }
  }
  .student-item.running .student-box-div { animation: runBounce 0.35s infinite ease-in-out; }
  .student-item.running.panic-mode .student-box-div { animation: runBounce 0.16s infinite ease-in-out !important; }

  .student-tag {
    background: #fff; border: 2px solid #3d2616; border-radius: 8px; padding: 2px 8px;
    font-size: 11px; font-weight: bold; color: #222; white-space: nowrap; margin-top: 2px; box-shadow: 0 2px 0 #3d2616;
  }
  .student-item.fainted .student-tag { background: #ffd6d6; border-color: #c9184a; color: #c9184a; }

  /* Bong thoại vui nhộn */
  .chat-bubble {
    position: absolute; top: -28px; background: #fff; border: 2px solid #222; border-radius: 10px;
    padding: 3px 8px; font-size: 10px; font-weight: bold; color: #111; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,0.18); z-index: 35;
  }
  .chat-bubble.panic-bubble { background: #fff3b0; border-color: #d90429; color: #b7094c; }
  .chat-bubble::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    border-width: 5px 5px 0; border-style: solid; border-color: #222 transparent;
  }

  /* Vòng xoáy thôi miên */
  @keyframes hypnoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .hypno-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85);
    display: none; justify-content: center; align-items: center; font-size: 26px; font-weight: bold; color: #d90429;
    animation: hypnoSpin 0.4s infinite linear;
  }
  .student-item.fainted .hypno-overlay { display: flex; }

  /* Footer điều khiển */
  .footer-bar {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 82px; background: #fff; border-top: 4px solid #ffccd5;
    display: flex; justify-content: space-around; align-items: center; padding: 10px 24px; z-index: 50;
  }
  .slider-box { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: bold; color: #4a3427; }
  .slider-num { background: #fff0f3; border: 2px solid #ff4d6d; color: #c9184a; padding: 3px 12px; border-radius: 8px; font-size: 18px; min-width: 38px; text-align: center; }
  .btn-fart-action {
    background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%); color: white; border: none; padding: 13px 42px;
    font-size: 16px; font-weight: bold; border-radius: 30px; box-shadow: 0 6px 0 #800f2f; cursor: pointer; transition: all 0.1s;
  }
  .btn-fart-action:active { transform: translateY(4px); box-shadow: 0 2px 0 #800f2f; }
  .btn-fart-action:disabled { background: linear-gradient(135deg, #9b5de5 0%, #f15bb5 100%); cursor: wait; }

  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 100; display: none; justify-content: center; align-items: center;
  }
  .modal-box { background: #fff; padding: 24px; border-radius: 20px; width: 440px; text-align: center; border: 5px solid #4a3427; }
  .modal-box textarea { width: 100%; height: 160px; padding: 10px; border-radius: 10px; border: 2px solid #ccc; font-family: inherit; margin: 12px 0; }
</style>
</head>
<body>

<div id="game-app">
  <div class="room-window"><div class="window-moon"></div></div>
  <div class="aquarium">🐠 🌿</div>
  <div class="tent-shelter"><div class="tent-door"></div></div>

  <!-- Header -->
  <div class="header-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 30px;">💨</span>
      <div class="header-title-box">
        <h1>ĐẠI TIỆC SHIN XÌ HƠI!</h1>
        <p>Phiên bản GitHub chuẩn 3D với file shin.png!</p>
      </div>
      <button class="btn-ui" onclick="openStudentModal()" style="color: #2b9348;">📝 Đổi Tên HS</button>
    </div>
    <div class="header-badges">
      <div class="badge">ĐANG CHƠI: <b id="count-playing">10</b></div>
      <div class="badge">ĐÃ GỌI: <b id="count-fainted">0</b></div>
      <button class="btn-ui" onclick="toggleAudio()" id="btn-sound">🔊</button>
    </div>
  </div>

  <div class="status-banner" id="status-banner">🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!</div>

  <canvas id="smoke-canvas"></canvas>

  <div class="room-stage" id="room-stage">
    <!-- SHIN 3D DÙNG FILE SHIN.PNG -->
    <div class="shin-wrapper" id="shin-boy" onclick="triggerFartEvent()">
      <img id="shin-img" class="shin-img-3d" src="shin.png" alt="Shin 3D">
      <div class="shin-tag">SHIN 🍮</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-bar">
    <div class="slider-box">
      <span>SỐ BẠN BỊ NGẤT MỖI LƯỢT:</span>
      <input type="range" id="faint-range" min="1" max="5" value="3" oninput="document.getElementById('num-preview').innerText = this.value">
      <span class="slider-num" id="num-preview">3</span>
    </div>

    <button class="btn-fart-action" id="btn-main-action" onclick="triggerFartEvent()">
      💨 SHIN XÌ HƠI! 🤢
    </button>

    <button class="btn-ui" onclick="resetGameStage()">🔄 Gọi lại từ đầu</button>
  </div>
</div>

<!-- Modal đổi tên -->
<div class="modal-overlay" id="name-modal">
  <div class="modal-box">
    <h3 style="color: #c9184a;">Danh Sách Học Sinh Trong Lớp</h3>
    <textarea id="student-names-input">Kazama
Masao
Nene
Bo-chan
Hoàng Minh Châu
Tạ Gia Hân
Phan Đức Phúc
Trịnh Thùy Linh
Vũ Hoàng Long
Phạm Tiến Đạt</textarea>
    <br>
    <button class="btn-fart-action" style="padding: 10px 24px; font-size: 14px; margin: 0 auto;" onclick="saveStudentNames()">Lưu & Bắt Đầu</button>
  </div>
</div>

<script>
  let soundEnabled = true;
  let isFartingPhase = false;
  let students = [];
  const roomStage = document.getElementById('room-stage');
  const canvas = document.getElementById('smoke-canvas');
  const ctx = canvas.getContext('2d');
  const banner = document.getElementById('status-banner');
  const mainBtn = document.getElementById('btn-main-action');

  function resizeCanvas() {
    canvas.width = 1060;
    canvas.height = 596;
  }
  resizeCanvas();

  const funnyPanicQuotes = ["🏃‍♂️ CHẠY MAU!", "🤢 Thúi quáaa!", "😷 Bịt mũi lại!", "🆘 Cứu tớ với!", "💨 Khói độc kìa!", "😭 Ngạt thở!"];

  function playAudioEffect(type) {
    if (!soundEnabled) return;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type === 'fart' ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(type === 'fart' ? 140 : 340, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.6);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    } catch(e){}
  }

  function toggleAudio() {
    soundEnabled = !soundEnabled;
    document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
  }

  let smokeParticles = [];
  class Smoke {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.7) * 7.5;
      this.vy = (Math.random() - 0.5) * 5;
      this.size = Math.random() * 26 + 18;
      this.alpha = 0.85;
      this.color = Math.random() > 0.5 ? 'rgba(118, 186, 0, ' : 'rgba(167, 219, 78, ';
    }
    update() { this.x += this.vx; this.y += this.vy; this.size += 0.9; this.alpha -= 0.01; }
    draw() {
      ctx.fillStyle = this.color + this.alpha + ')';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  function renderSmokeLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      smokeParticles[i].update();
      if (smokeParticles[i].alpha <= 0) smokeParticles.splice(i, 1);
      else smokeParticles[i].draw();
    }
    requestAnimationFrame(renderSmokeLoop);
  }
  requestAnimationFrame(renderSmokeLoop);

  let moveInterval = null;
  function startMovementLoop(panicMode = false) {
    if (moveInterval) clearInterval(moveInterval);
    moveInterval = setInterval(() => {
      document.querySelectorAll('.student-item.running').forEach(kid => {
        let curLeft = parseFloat(kid.style.left);
        let curBottom = parseFloat(kid.style.bottom);
        let dx = (Math.random() - 0.5) * (panicMode ? 200 : 120);
        let dy = (Math.random() - 0.5) * (panicMode ? 80 : 50);
        let newX = Math.max(35, Math.min(930, curLeft + dx));
        let newY = Math.max(105, Math.min(265, curBottom + dy));
        if (newX > 520 && newX < 740) newX = newX > 630 ? 760 : 500;
        kid.style.left = `${newX}px`; kid.style.bottom = `${newY}px`;

        const bubble = kid.querySelector('.chat-bubble');
        if (panicMode) {
          bubble.classList.add('panic-bubble');
          if (Math.random() > 0.4) {
            bubble.innerText = funnyPanicQuotes[Math.floor(Math.random() * funnyPanicQuotes.length)];
            bubble.style.display = 'block';
          }
        } else {
          bubble.classList.remove('panic-bubble');
          if (Math.random() > 0.85) bubble.style.display = 'none';
        }
      });
    }, panicMode ? 350 : 1100);
  }

  function spawnComicBurst(text) {
    const comic = document.createElement('div');
    comic.className = 'fart-comic-text'; comic.innerText = text;
    roomStage.appendChild(comic);
    setTimeout(() => comic.remove(), 1000);
  }

  function triggerFartEvent() {
    if (isFartingPhase) return;
    const activeKids = Array.from(document.querySelectorAll('.student-item.running'));
    if (!activeKids.length) return alert("Tất cả đã xỉu hết rồi!");

    isFartingPhase = true;
    mainBtn.disabled = true; mainBtn.innerText = '😱 ĐANG CHẠY TRỐN...';
    banner.innerText = '🏃‍♂️ CHẠY MAU! CÁC BẠN ĐANG CHẠY TRỐN KHẮP PHÒNG!';
    banner.style.background = '#ffd166';

    const shinImg = document.getElementById('shin-img');
    shinImg.classList.add('shin-farting');

    activeKids.forEach(kid => {
      kid.classList.add('panic-mode');
      const bubble = kid.querySelector('.chat-bubble');
      bubble.classList.add('panic-bubble');
      bubble.innerText = funnyPanicQuotes[Math.floor(Math.random() * funnyPanicQuotes.length)];
      bubble.style.display = 'block';
    });
    startMovementLoop(true);

    [0, 1500, 3000].forEach((delay, idx) => {
      setTimeout(() => {
        if (!isFartingPhase) return;
        playAudioEffect('fart');
        spawnComicBurst(idx % 2 === 0 ? 'BỤP! XỲYYY! 💨' : 'THÚI QUÁ... 🤢');
        for (let i = 0; i < 45; i++) {
          setTimeout(() => smokeParticles.push(new Smoke(640, 420)), i * 12);
        }
      }, delay);
    });

    setTimeout(() => {
      const numToFaint = parseInt(document.getElementById('faint-range').value);
      const chosen = activeKids.sort(() => 0.5 - Math.random()).slice(0, numToFaint);

      banner.innerText = '😵 MÙI THÚI ĐÃ BẮT KỊP CÁC BẠN!';
      banner.style.background = '#ffccd5';

      chosen.forEach((kid, idx) => {
        setTimeout(() => {
          kid.classList.remove('running', 'panic-mode');
          kid.classList.add('fainted');
          playAudioEffect('faint');
          updateCounters();
        }, idx * 450);
      });

      setTimeout(() => {
        isFartingPhase = false;
        shinImg.classList.remove('shin-farting');
        document.querySelectorAll('.student-item.running').forEach(k => {
          k.classList.remove('panic-mode');
          k.querySelector('.chat-bubble').style.display = 'none';
        });
        startMovementLoop(false);
        mainBtn.disabled = false; mainBtn.innerText = '💨 SHIN XÌ HƠI TIẾP! 🤢';
      }, chosen.length * 450 + 600);

    }, 4500);
  }

  function updateCounters() {
    document.getElementById('count-playing').innerText = document.querySelectorAll('.student-item.running').length;
    document.getElementById('count-fainted').innerText = document.querySelectorAll('.student-item.fainted').length;
  }

  function initializeStudents() {
    document.querySelectorAll('.student-item').forEach(e => e.remove());
    const names = document.getElementById('student-names-input').value.split('\n').filter(n => n.trim() !== '');

    names.forEach((name, i) => {
      const kid = document.createElement('div');
      kid.className = 'student-item running';

      kid.innerHTML = `
        <div class="chat-bubble" style="display:none;"></div>
        <div class="student-box-div">
          ${name}
          <div class="hypno-overlay">😵‍💫</div>
        </div>
        <div class="student-tag">${name}</div>
      `;

      let x = Math.random() * 800 + 40;
      let y = Math.random() * 150 + 105;
      if (x > 520 && x < 740) x = 450;
      kid.style.left = x + 'px'; kid.style.bottom = y + 'px';

      roomStage.appendChild(kid);
    });
    updateCounters();
    startMovementLoop(false);
  }

  function resetGameStage() {
    isFartingPhase = false;
    banner.innerText = '🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!';
    banner.style.background = '#fff8bd';
    mainBtn.disabled = false; mainBtn.innerText = '💨 SHIN XÌ HƠI! 🤢';
    document.getElementById('shin-img').classList.remove('shin-farting');
    initializeStudents();
  }

  function openStudentModal() { document.getElementById('name-modal').style.display = 'flex'; }
  function saveStudentNames() { document.getElementById('name-modal').style.display = 'none'; resetGameStage(); }

  window.onload = initializeStudents;
</script>

</body>
</html>
