<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẠI TIỆC SHIN XÌ HƠI! - PAJAMA PARTY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Mali:wght@700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1e1e24;
            font-family: 'Comfortaa', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung Game chuẩn tỉ lệ 16:9 giống ảnh đính kèm */
        #game-container {
            width: 1024px;
            height: 576px;
            background: #bbf2be; /* Tông màu xanh nhạt của nền gốc */
            border: 8px solid #4a2c11;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
        }

        /* Nền canvas chính vẽ nhân vật & hiệu ứng mượt mà */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Lớp nền tĩnh (Cửa sổ, bể cá, lều, trang trí) */
        .game-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #d8f5d3;
            z-index: 1;
        }

        /* Cửa sổ ban đêm có rèm hồng và trăng */
        .custom-window {
            position: absolute;
            top: 55px;
            left: 130px;
            width: 220px;
            height: 180px;
            background: #14163c;
            border: 10px solid #ffa5be;
            border-bottom: 16px solid #ffa5be;
            border-radius: 20px 20px 0 0;
            z-index: 2;
        }
        .custom-window::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 6px; background: #ffa5be;
            transform: translateY(-50%);
        }
        .custom-window::after {
            content: '';
            position: absolute;
            left: 50%; top: 0; width: 6px; height: 100%; background: #ffa5be;
            transform: translateX(-50%);
        }
        .moon {
            position: absolute;
            top: 15px;
            right: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 10px 10px 0 0 #fbe25d;
        }

        /* Bể cá cảnh bên trái */
        .aquarium-box {
            position: absolute;
            bottom: 120px;
            left: 30px;
            width: 150px;
            height: 100px;
            background: linear-gradient(180deg, rgba(142, 212, 255, 0.8) 0%, rgba(48, 152, 218, 0.9) 100%);
            border: 5px solid #dcdcdc;
            border-radius: 12px;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        /* Lều cắm trại Pijama ngủ */
        .cozy-tent {
            position: absolute;
            bottom: 100px;
            right: 25px;
            width: 150px;
            height: 180px;
            background: #fbd068;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border-left: 12px solid #e1aa2c;
            z-index: 3;
        }
        .cozy-tent::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 45px;
            width: 45px;
            height: 65px;
            background: #623e14;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* UI TRÊN CÙNG */
        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 4px solid #ffcbd5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 50;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h1 {
            font-size: 23px;
            color: #d62246;
            font-family: 'Comfortaa', sans-serif;
            text-shadow: 1px 1px 0px #ffe5ec;
        }
        .header-title p {
            font-size: 11px;
            color: #666;
        }
        .header-stats {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .badge {
            background: #fff;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: bold;
            color: #4a3427;
        }
        .badge span {
            color: #d62246;
            font-size: 14px;
        }
        .btn-config {
            background: #4caf50;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .sound-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* BĂNG RÔN THÔNG BÁO Ở GIỮA GIỐNG ẢNH MẪU */
        .alert-banner {
            position: absolute;
            top: 82px;
            left: 50%;
            transform: translateX(-50%);
            background: #e2f7cb;
            border: 2px solid #a3cf62;
            border-radius: 30px;
            padding: 6px 36px;
            font-size: 12px;
            font-weight: bold;
            color: #2b540f;
            box-shadow: 0 3px 0 #a3cf62;
            z-index: 40;
            transition: background 0.3s, color 0.3s;
        }

        /* UI DƯỚI CÙNG VÀ NÚT BẤM CHÍNH */
        .game-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #ffffff;
            border-top: 4px solid #ffccd5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 24px;
            z-index: 50;
        }
        .slider-control {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            font-weight: bold;
            color: #4a3427;
        }
        .slider-control input[type="range"] {
            accent-color: #f72585;
        }
        .qty-badge {
            background: #fff;
            border: 2px solid #f72585;
            color: #d62246;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .action-btn {
            background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 5px 0 #7209b7;
            cursor: pointer;
            transition: all 0.1s;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7209b7;
        }
        .restart-btn {
            background: #fdfdfd;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
        }

        /* POPUP SỬA TÊN */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-body {
            background: white;
            padding: 20px;
            border-radius: 18px;
            width: 400px;
            text-align: center;
            border: 5px solid #4a3427;
        }
        textarea {
            width: 100%;
            height: 140px;
            margin: 12px 0;
            padding: 10px;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="game-bg"></div>
    <div class="custom-window"><div class="moon"></div></div>
    <div class="aquarium-box">🐠 🌿</div>
    <div class="cozy-tent"></div>

    <!-- UI Trên -->
    <div class="game-header">
        <div class="header-title">
            <span>🎉</span>
            <div>
                <h1>ĐẠI TIỆC SHIN XÌ HƠI!</h1>
                <p>Nằm pijama ăn bánh mà Shin xì hơi là các bạn ngất bẹp!</p>
            </div>
            <button class="btn-config" onclick="togglePopup(true)">📝 Đổi Tên Học Sinh</button>
        </div>
        <div class="header-stats">
            <div class="badge">ĐANG CHƠI: <span id="playing-cnt">10</span></div>
            <div class="badge">ĐÃ XỈU: <span id="fainted-cnt">0</span></div>
            <button class="sound-btn" onclick="switchAudio()" id="sound-icon">🔊</button>
        </div>
    </div>

    <!-- Banner vàng-xanh chuẩn -->
    <div class="alert-banner" id="banner">🎂 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!</div>

    <!-- Canvas Vẽ mượt các chuyển động vật lý, nhân vật hoạt hình -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Dưới -->
    <div class="game-footer">
        <div class="slider-control">
            <span>SỐ BẠN BỊ NGẤT MỖI LƯỢT:</span>
            <input type="range" id="faint-slider" min="1" max="5" value="3" oninput="document.getElementById('slider-qty').innerText = this.value">
            <span class="qty-badge" id="slider-qty">3</span>
        </div>

        <button class="action-btn" id="action-btn" onclick="startFart()">
            🧁 SHIN XÌ HƠI! 🤢
        </button>

        <button class="restart-btn" onclick="resetAll()">🔄 Gọi lại từ đầu</button>
    </div>
</div>

<!-- Modal Đổi tên -->
<div class="modal" id="popup">
    <div class="modal-body">
        <h3 style="color: #b5179e;">Cập Nhật Thành Viên</h3>
        <p style="font-size: 12px; color: #666; margin-top: 5px;">Nhập tên học sinh (mỗi dòng một bạn):</p>
        <textarea id="names-input">Vy
Hoàng Minh Châu
Tạ Gia Hân
Phan Đức Phúc
Hoàng Ngân
Trịnh Thùy Linh
Vũ Hoàng Long
Kaon, Masao
Ngọc Diệp
Hồng Đạt</textarea>
        <br>
        <button class="action-btn" style="font-size:13px; padding: 10px 20px;" onclick="saveNames()">Xong nà!</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const alertBanner = document.getElementById('banner');
    const actBtn = document.getElementById('action-btn');

    let audioEnabled = true;
    let students = [];
    let state = 'peaceful'; // 'peaceful', 'farting', 'panicking'
    let isTransitioningToFart = false; // Phase check

    // Đặt lại kích thước canvas
    function initCanvasSize() {
        canvas.width = 1024;
        canvas.height = 576;
    }
    initCanvasSize();

    // Dữ liệu mảng pijama màu sắc & kiểu tóc học sinh
    const pajamaSkins = [
        { hair: '#5d4037', hairStyle: 'girls-pigtails', pjColor: '#f8bbd0', pjPattern: 'dots', patternColor: '#e91e63' }, // Nene - Minh Châu
        { hair: '#111111', hairStyle: 'spiky', pjColor: '#e1f5fe', pjPattern: 'stripes', patternColor: '#0288d1' }, // Kazama - Hoàng Long
        { hair: '#3e2723', hairStyle: 'bald-round', pjColor: '#fff9c4', pjPattern: 'dots', patternColor: '#f57c00' }, // Masao - Đức Phúc
        { hair: '#1a237e', hairStyle: 'bob', pjColor: '#b2dfdb', pjPattern: 'squares', patternColor: '#00796b' }  // Bo-chan - Gia Hân
    ];

    // Tạo âm thanh giả lập bằng Web Audio API
    function playSfx(type) {
        if (!audioEnabled) return;
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            if (type === 'fart') {
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, actx.currentTime);
                osc.frequency.linearRampToValueAtTime(25, actx.currentTime + 0.65);
                gain.gain.setValueAtTime(0.6, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.7);
            } else if (type === 'faint') {
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, actx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.5);
            }
        } catch (e) {}
    }

    function switchAudio() {
        audioEnabled = !audioEnabled;
        document.getElementById('sound-icon').innerText = audioEnabled ? '🔊' : '🔇';
    }

    // Class quản lý các hạt khói rắm
    let smokeArray = [];
    class SmokeParticle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.7) * 5 - 2; // Bay mạnh về bên trái
            this.vy = (Math.random() - 0.5) * 3;
            this.size = Math.random() * 20 + 15;
            this.alpha = 0.85;
            this.growth = 0.6;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.size += this.growth;
            this.alpha -= 0.012;
        }
        draw() {
            ctx.fillStyle = `rgba(130, 201, 80, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // HỒNG HOẠT CHỮ TRUYỆN TRANH "BỤP! XỲYYY!"
    let comicTexts = [];
    class ComicText {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.scale = 0.4;
            this.alpha = 1;
            this.rotate = -15 * Math.PI / 180;
        }
        update() {
            if (this.scale < 1.1) this.scale += 0.08;
            this.y -= 1;
            this.alpha -= 0.015;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotate);
            ctx.scale(this.scale, this.scale);
            ctx.font = "900 36px 'Mali', sans-serif";
            
            // Vẽ bóng chữ cho xịn sò
            ctx.fillStyle = "#1b4332";
            ctx.fillText("BỤP! XỲYYY! 💨🤢", 4, 4);

            ctx.fillStyle = "#38b000";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.strokeText("BỤP! XỲYYY! 💨🤢", 0, 0);
            ctx.fillText("BỤP! XỲYYY! 💨🤢", 0, 0);
            ctx.restore();
        }
    }

    // NHÂN VẬT SHIN CẬU BÉ BÚT CHÌ ĐA TRẠNG THÁI
    const shin = {
        x: 640,
        y: 350,
        width: 120,
        height: 140,
        frame: 0,
        fartProgress: 0, // Dùng để quản lý từng giây phút tuột quần xì hơi
        
        draw(bobbing) {
            ctx.save();
            ctx.translate(this.x, this.y + (state === 'peaceful' ? bobbing : 0));

            if (state === 'peaceful') {
                // PHASE 1: ÔN HÒA (Đứng thẳng, nhai đĩa bánh)
                // Chân
                ctx.fillStyle = '#fbc02d'; // tất vàng
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.ellipse(35, 128, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(65, 128, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                // Quần dài xanh
                ctx.fillStyle = '#2196f3';
                ctx.beginPath(); ctx.roundRect(22, 98, 56, 26, 10); ctx.fill(); ctx.stroke();
                // Họa tiết pijama
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(36, 110, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(64, 106, 3, 0, Math.PI*2); ctx.fill();

                // Áo pijama xanh béo tròn
                ctx.fillStyle = '#2196f3';
                ctx.beginPath(); ctx.roundRect(18, 65, 64, 40, 12); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(32, 78, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(60, 88, 4.5, 0, Math.PI*2); ctx.fill();

                // Cánh tay đang cầm bánh ăn
                ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 14; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(76, 85); ctx.lineTo(92, 85); ctx.stroke();
                ctx.lineWidth = 2.5;

                // Đĩa bánh
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.ellipse(98, 85, 14, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#6d4c41'; // Bánh gato
                ctx.beginPath(); ctx.arc(98, 81, 6, 0, Math.PI*2); ctx.fill();

                // Cánh tay đưa bánh lên miệng nhai nhai
                ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 12;
                ctx.beginPath(); ctx.moveTo(35, 80); ctx.lineTo(26, 68); ctx.stroke();
                ctx.lineWidth = 2.5;

                // Đầu to đặc trưng, má phính Shin-chan quay sang trái nếm bánh
                ctx.fillStyle = '#ffcc80';
                ctx.beginPath(); ctx.ellipse(50, 42, 22, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(71, 44, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); // Tai

                // Lông mày sâu róm rậm
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.roundRect(30, 31, 14, 5, 2); ctx.fill();
                ctx.beginPath(); ctx.roundRect(54, 30, 14, 5, 2); ctx.fill();

                // Mắt to tròn đang nheo híp vui nhai bánh
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(38, 42, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(58, 41, 2.5, 0, Math.PI*2); ctx.fill();
                // Miệng nhai hạnh phúc
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(46, 51, 4, 0, Math.PI, false); ctx.stroke();

            } else {
                // PHASE 2: THẢ RẮM (Cúi khom lưng, hai tay tụt quần dơ mông chổng ra trái)
                // Hai chân dạt ra
                ctx.fillStyle = '#fbc02d';
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.ellipse(25, 128, 11, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(75, 128, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                // Quần tụt pijama xanh để lộ mông
                ctx.fillStyle = '#2196f3';
                ctx.beginPath(); ctx.roundRect(35, 110, 52, 20, 8); ctx.fill(); ctx.stroke();

                // BỜ MÔNG CHỔNG RA CHÂN THỰC y như mẫu, trêu ngươi
                ctx.fillStyle = '#ffcc80';
                // Vẽ mông tròn căng dính sát
                ctx.beginPath(); ctx.arc(24, 112, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(40, 110, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // Khe mông
                ctx.strokeStyle = '#ff8a65'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(28, 120); ctx.quadraticCurveTo(30, 104, 32, 102); ctx.stroke();
                ctx.lineWidth = 2.5;

                // Thân khom nghiêng về phải
                ctx.fillStyle = '#2196f3';
                ctx.beginPath(); ctx.ellipse(60, 85, 34, 25, 20 * Math.PI / 180, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // Họa tiết pijama
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(50, 78, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(74, 82, 3, 0, Math.PI*2); ctx.fill();

                // Tay trái dơ bánh ra sau
                ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 11;
                ctx.beginPath(); ctx.moveTo(76, 88); ctx.lineTo(95, 84); ctx.stroke();
                ctx.lineWidth = 2.5;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.ellipse(98, 83, 12, 3, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#6d4c41';
                ctx.beginPath(); ctx.arc(98, 79, 5, 0, Math.PI*2); ctx.fill();

                // Cánh tay kéo quần pijama (tuột quần thả rắm)
                ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 10;
                ctx.beginPath(); ctx.moveTo(42, 90); ctx.quadraticCurveTo(46, 112, 38, 112); ctx.stroke();
                ctx.lineWidth = 2.5;

                // Đầu to tròn hướng nhìn về phía người chơi xem phản ứng ranh ma
                ctx.fillStyle = '#ffcc80';
                ctx.beginPath(); ctx.ellipse(54, 45, 24, 20, 10 * Math.PI / 180, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(75, 48, 5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); // Tai

                // Lông mày rậm và mắt khép nhỏ nhe nhe tinh quái
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.roundRect(36, 34, 12, 5, 2); ctx.fill();
                ctx.beginPath(); ctx.roundRect(58, 35, 12, 5, 2); ctx.fill();
                
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(40, 48); ctx.lineTo(48, 46); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(60, 47); ctx.lineTo(66, 49); ctx.stroke();
                ctx.lineWidth = 2.5;

                // Nụ cười khoái chí chuẩn cậu bé Shin
                ctx.beginPath(); ctx.arc(52, 56, 3, 0, Math.PI, false); ctx.stroke();
            }

            // Nhãn Tên màu vàng dẹt bo góc y mẫu
            ctx.fillStyle = '#ffeb3b';
            ctx.strokeStyle = '#4a2c11';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(14, 134, 76, 20, 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#4a2c11';
            ctx.font = 'bold 11px Comfortaa';
            ctx.fillText("SHIN 🍮", 26, 148);

            ctx.restore();
        }
    };

    // CLASS QUẢN LÝ TẤT CẢ CÁC BẠN HỌC SINH PIJAMA CHUẨN ĐỒ HỌA
    class Student {
        constructor(name, index) {
            this.name = name;
            this.index = index;
            this.skin = pajamaSkins[index % pajamaSkins.length];
            
            // Xếp vị trí ngẫu nhiên bên trái, tránh xa Shin
            this.x = Math.random() * 480 + 50;
            this.y = Math.random() * 150 + 290;
            this.status = 'running'; // 'running' hoặc 'fainted'
            this.faintTimer = 0; // Hiệu ứng xoắn ốc chuyển động

            // Các vector chuyển động
            this.targetX = this.x;
            this.targetY = this.y;
            this.moveSpeed = Math.random() * 2 + 3;
            this.animTimer = Math.random() * 50;
            this.shoutTimer = 0;
            this.shoutVisible = false;
        }

        update() {
            if (this.status === 'running') {
                this.animTimer += 0.2;

                // Di chuyển ngẫu nhiên dồn dập nếu có sự kiện xì hơi
                if (state === 'farting') {
                    this.moveSpeed = 6.5; // Chạy nhanh hơn hoảng loạn
                    if (Math.abs(this.x - this.targetX) < 10 && Math.abs(this.y - this.targetY) < 10) {
                        this.targetX = Math.random() * 450 + 40;
                        this.targetY = Math.random() * 130 + 280;
                    }

                    // Thỉnh thoảng kêu la "CHẠY MAU!"
                    if (Math.random() > 0.98 && this.shoutTimer <= 0) {
                        this.shoutVisible = true;
                        this.shoutTimer = 45;
                    }
                } else {
                    this.moveSpeed = 1.2; // Đi chậm ôn hòa nhảy nhảy nhót nhót
                    if (Math.abs(this.x - this.targetX) < 5 && Math.abs(this.y - this.targetY) < 5) {
                        this.targetX = this.x + (Math.random() - 0.5) * 50;
                        this.targetY = this.y + (Math.random() - 0.5) * 30;
                        // Giới hạn trong căn phòng
                        this.targetX = Math.max(40, Math.min(550, this.targetX));
                        this.targetY = Math.max(280, Math.min(420, this.targetY));
                    }
                }

                // Di chuyển mượt mà tới mục tiêu
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 1) {
                    this.x += (dx / dist) * this.moveSpeed;
                    this.y += (dy / dist) * this.moveSpeed;
                }

                if (this.shoutTimer > 0) {
                    this.shoutTimer--;
                    if (this.shoutTimer <= 0) this.shoutVisible = false;
                }

            } else if (this.status === 'fainted') {
                this.faintTimer += 0.12; // Tốc độ xoay mắt xoắn ốc @@
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // NẾU BỊ NGẤT XỈU THÌ XOAY NGƯỜI NẰM NGỬA RA ĐẤT (Y HỆT PHẢN ỨNG MẪU)
            if (this.status === 'fainted') {
                ctx.rotate(85 * Math.PI / 180);
                ctx.translate(-40, -10);
            }

            // Tính hiệu ứng di chuyển dập dềnh chạy nhảy
            const walkCycle = this.status === 'running' ? Math.sin(this.animTimer) * 6 : 0;
            const tilt = this.status === 'running' ? Math.sin(this.animTimer) * 0.08 : 0;

            ctx.translate(40, 50);
            ctx.rotate(tilt);
            ctx.translate(-40, -50);

            // 1. Chân & Tất pijama
            ctx.fillStyle = this.skin.pjColor;
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2.2;
            const leftLegY = 85 + (this.status === 'running' ? Math.sin(this.animTimer * 1.5) * 4 : 0);
            const rightLegY = 85 + (this.status === 'running' ? Math.cos(this.animTimer * 1.5) * 4 : 0);
            
            ctx.beginPath(); ctx.roundRect(16, leftLegY, 14, 12, 4); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.roundRect(50, rightLegY, 14, 12, 4); ctx.fill(); ctx.stroke();

            // 2. Toàn thân pijama
            ctx.beginPath(); ctx.roundRect(14, 50, 52, 40, 10); ctx.fill(); ctx.stroke();
            // Hoạ tiết áo pijama đặc trưng (Chấm bi hoặc kẻ ô, stripes)
            ctx.fillStyle = this.skin.patternColor;
            if (this.skin.pjPattern === 'dots') {
                ctx.beginPath(); ctx.arc(26, 60, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(52, 64, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(38, 76, 3.5, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.strokeStyle = this.skin.patternColor; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(22, 54); ctx.lineTo(22, 86); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(42, 52); ctx.lineTo(42, 88); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(56, 54); ctx.lineTo(56, 86); ctx.stroke();
                ctx.lineWidth = 2.2;
            }

            // 3. Cánh tay dơ lên khi chạy nhảy / ăn bánh
            ctx.strokeStyle = this.skin.pjColor; ctx.lineWidth = 10; ctx.lineCap = 'round';
            if (state === 'peaceful' && this.status === 'running') {
                // Cầm đồ ăn
                ctx.beginPath(); ctx.moveTo(64, 66); ctx.lineTo(76, 62); ctx.stroke();
                ctx.lineWidth = 2.2;
                ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.arc(78, 60, 4, 0, Math.PI*2); ctx.fill();
            } else {
                // Đơ hoảng loạn giơ cao
                ctx.beginPath(); ctx.moveTo(8, 56); ctx.lineTo(-4, 45 + walkCycle); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(70, 58); ctx.lineTo(82, 47 - walkCycle); ctx.stroke();
                ctx.lineWidth = 2.2;
            }

            // 4. Đầu hoạt hình chuẩn phong cách Shin
            ctx.fillStyle = '#ffcc80';
            ctx.beginPath(); ctx.ellipse(40, 26, 21, 18, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            // 5. Tóc nhiều kiểu pijama của Shin-chan & Nene & Masao
            ctx.fillStyle = this.skin.hair;
            if (this.skin.hairStyle === 'girls-pigtails') {
                // Búi tóc 2 bên
                ctx.beginPath(); ctx.arc(14, 18, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(66, 18, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(40, 14, 19, Math.PI, 0, false); ctx.fill(); ctx.stroke();
            } else if (this.skin.hairStyle === 'spiky') {
                ctx.beginPath(); ctx.moveTo(18, 18); ctx.lineTo(40, 4); ctx.lineTo(62, 18); ctx.closePath(); ctx.fill(); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(40, 16, 20, Math.PI, 0, false); ctx.fill(); ctx.stroke();
            }

            // 6. Khuôn mặt mắt thôi miên (Khi ngất xỉu) hoặc nhắm mở híp (khi sống)
            if (this.status === 'fainted') {
                // HIỆU ỨNG THÔI MIÊN VÒNG XOÁN ỐC XOAY TRÒN (Y HỆT VIDEO GỐC)
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
                
                // Mắt xoắn Trái
                ctx.save();
                ctx.translate(28, 28);
                ctx.rotate(this.faintTimer);
                ctx.beginPath();
                for (let a = 0; a < 14; a++) {
                    let r = a * 0.7;
                    let th = a * 0.55;
                    ctx.lineTo(r * Math.cos(th), r * Math.sin(th));
                }
                ctx.stroke();
                ctx.restore();

                // Mắt xoắn Phải
                ctx.save();
                ctx.translate(52, 28);
                ctx.rotate(this.faintTimer);
                ctx.beginPath();
                for (let a = 0; a < 14; a++) {
                    let r = a * 0.7;
                    let th = a * 0.55;
                    ctx.lineTo(r * Math.cos(th), r * Math.sin(th));
                }
                ctx.stroke();
                ctx.restore();

                // Miệng "O" ngỡ ngàng
                ctx.fillStyle = '#d81b60';
                ctx.beginPath(); ctx.arc(40, 36, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            } else {
                // Khi đang hoạt động - hoảng hốt hoặc vui vẻ ăn uống
                ctx.fillStyle = '#000000';
                if (state === 'farting') {
                    // Mắt chữ A chữ O hoảng hốt chạy trốn
                    ctx.beginPath(); ctx.arc(28, 28, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(52, 28, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#d81b60';
                    ctx.beginPath(); ctx.arc(40, 38, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else {
                    // Trạng thái từ tốn ăn uống thảnh thơi
                    ctx.beginPath(); ctx.ellipse(28, 28, 3, 2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(52, 28, 3, 2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(40, 34, 3, 0, Math.PI); ctx.stroke();
                }
            }

            ctx.restore();

            // 7. Bóng thoại thông báo "CHẠY MAU" hoặc "NGẤT XỈU THÚI QUÁ"
            if (this.status === 'fainted') {
                this.drawSpeechBubble("Thúi quá... ngất! 😵");
            } else if (this.shoutVisible) {
                this.drawSpeechBubble("🏃‍♂️ CHẠY MAU!");
            }

            // 8. Tên nhãn của từng bé pijama
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.status === 'fainted' ? '#ffdada' : '#ffffff';
            ctx.strokeStyle = this.status === 'fainted' ? '#aa0000' : '#4a3427';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(5, 95, 70, 18, 9); ctx.fill(); ctx.stroke();
            ctx.fillStyle = this.status === 'fainted' ? '#aa0000' : '#333333';
            ctx.font = 'bold 10px Comfortaa';
            ctx.textAlign = 'center';
            ctx.fillText(this.name, 40, 108);
            ctx.restore();
        }

        drawSpeechBubble(text) {
            ctx.save();
            ctx.translate(this.x + 40, this.y - 12);
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 2.2;
            
            ctx.font = 'bold 9px Comfortaa';
            const width = ctx.measureText(text).width + 12;

            ctx.beginPath();
            ctx.roundRect(-width/2, -15, width, 18, 7);
            ctx.fill(); ctx.stroke();

            // Trỏ của bóng thoại
            ctx.beginPath();
            ctx.moveTo(-4, 3); ctx.lineTo(0, 9); ctx.lineTo(4, 3);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.fillText(text, 0, -3);
            ctx.restore();
        }
    }

    let allStudents = [];

    // GỌI PHÉP THẢ RẤM SHIN TỪ TỐN SANG ĐỢT PHUN KHÓI MÙ MỊT
    function startFart() {
        if (state === 'farting') return; // Không click dồn dập
        
        state = 'farting';
        playSfx('fart');

        // Bùng chữ truyện tranh rung bần bật
        comicTexts.push(new ComicText(610, 310));

        // Phun mịt khói cuộn trào từ vị trí mông dở pijama của Shin
        for (let i = 0; i < 48; i++) {
            setTimeout(() => {
                if (state === 'farting') {
                    smokeArray.push(new SmokeParticle(635, 460));
                }
            }, i * 11);
        }

        // Thay banner và hành vi nút
        alertBanner.innerText = '🏃‍♂️ CHẠY MAU! CÁC BẠN ĐANG CHẠY TRỐN KHẮP PHÒNG!';
        alertBanner.style.background = '#ffccd5';
        alertBanner.style.color = '#7209b7';
        actBtn.innerText = 'ĐANG CHẠY TRỐN...';

        // Sau 1 giây hỗn loạn chạy trốn sẽ bắt và làm ngất học sinh dính đòn
        setTimeout(() => {
            faintRandomStudents();
        }, 1100);
    }

    function faintRandomStudents() {
        const activeList = allStudents.filter(s => s.status === 'running');
        if (activeList.length === 0) {
            alert("Tất cả đã ngất lịm vì quá thối! Nhấn nút 'Gọi lại từ đầu' nhé!");
            state = 'peaceful';
            actBtn.innerText = '🧁 SHIN XÌ HƠI! 🤢';
            return;
        }

        const countToFaint = parseInt(document.getElementById('faint-slider').value);
        let actual = Math.min(countToFaint, activeList.length);

        // Chọn ngẫu nhiên
        const chosen = activeList.sort(() => 0.5 - Math.random()).slice(0, actual);

        chosen.forEach((st, i) => {
            setTimeout(() => {
                st.status = 'fainted';
                playSfx('faint');
                updateBadges();
            }, i * 400);
        });

        // Chờ các bạn ngất xong sẽ đưa Shin về lại trạng thái ôn hòa tiếp tục ăn bánh
        setTimeout(() => {
            state = 'peaceful';
            alertBanner.innerText = '🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!';
            alertBanner.style.background = '#e2f7cb';
            alertBanner.style.color = '#2b540f';
            actBtn.innerText = '🧁 SHIN XÌ HƠI! 🤢';
        }, actual * 400 + 800);
    }

    function updateBadges() {
        const p = allStudents.filter(s => s.status === 'running').length;
        const f = allStudents.filter(s => s.status === 'fainted').length;
        document.getElementById('playing-cnt').innerText = p;
        document.getElementById('fainted-cnt').innerText = f;
    }

    // TẢI & RESET GAME
    function initStudents() {
        const names = document.getElementById('names-input').value
            .split('\n')
            .filter(n => n.trim() !== "");

        allStudents = names.map((n, i) => new Student(n, i));
        updateBadges();
    }

    function resetAll() {
        state = 'peaceful';
        alertBanner.innerText = '🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!';
        alertBanner.style.background = '#e2f7cb';
        alertBanner.style.color = '#2b540f';
        actBtn.innerText = '🧁 SHIN XÌ HƠI! 🤢';
        smokeArray = [];
        comicTexts = [];
        initStudents();
    }

    function togglePopup(show) {
        document.getElementById('popup').style.display = show ? 'flex' : 'none';
    }

    function saveNames() {
        togglePopup(false);
        resetAll();
    }

    // VÒNG LẶP HOẠT HÌNH FRAME CHUYỂN ĐỘNG TRƠN TRU (GAME LOOP)
    let globalTimer = 0;
    function loop() {
        globalTimer += 0.05;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Độ nhấp nhô nhảy nhẹ pijama pijama khi đứng yên
        const bob = Math.sin(globalTimer) * 4;

        // Vẽ mây khói, chữ comic lên trên
        for (let i = smokeArray.length - 1; i >= 0; i--) {
            smokeArray[i].update();
            if (smokeArray[i].alpha <= 0) {
                smokeArray.splice(i, 1);
            } else {
                smokeArray[i].draw();
            }
        }

        // Vẽ các học sinh
        allStudents.forEach(st => {
            st.update();
            st.draw();
        });

        // Vẽ cậu bé Shin
        shin.draw(bob);

        // Hiển thị chữ truyện tranh nổ rực rỡ
        for (let i = comicTexts.length - 1; i >= 0; i--) {
            comicTexts[i].update();
            if (comicTexts[i].alpha <= 0) {
                comicTexts.splice(i, 1);
            } else {
                comicTexts[i].draw();
            }
        }

        requestAnimationFrame(loop);
    }

    // Bắt đầu
    initStudents();
    requestAnimationFrame(loop);
</script>
