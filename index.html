<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐẠI TIỆC SHIN XÌ HƠI! - PAJAMA PARTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap');
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

  body {
    background: #1e1e24;
    font-family: 'Comfortaa', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game-app {
    width: 1024px;
    height: 576px;
    background: #d8f5d3 url('assets/bg_classroom.png') no-repeat center/cover;
    border: 8px solid #4a3427;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header-bar {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 70px;
    background: rgba(255, 255, 255, 0.95);
    border-bottom: 4px solid #ffccd5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 50;
  }

  .status-banner {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8bd;
    border: 2px solid #f4a261;
    border-radius: 30px;
    padding: 6px 30px;
    font-size: 13px;
    font-weight: bold;
    color: #4a2800;
    z-index: 40;
  }

  .stage {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
  }

  /* Shin */
  .shin-box {
    position: absolute;
    bottom: 120px;
    left: 620px;
    width: 130px;
    height: 140px;
    z-index: 25;
    cursor: pointer;
    text-align: center;
  }
  .shin-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .shin-tag {
    background: #ffeb3b;
    border: 2px solid #5d4037;
    border-radius: 10px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: bold;
    display: inline-block;
  }

  /* Học sinh */
  .student-box {
    position: absolute;
    width: 85px;
    height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transition: left 0.8s ease, bottom 0.8s ease;
    z-index: 20;
  }
  .student-img {
    width: 65px;
    height: 80px;
    object-fit: contain;
  }
  .student-box.fainted .student-img {
    transform: rotate(85deg);
    filter: drop-shadow(0 0 6px rgba(118, 186, 0, 0.6));
  }
  .student-name {
    background: #fff;
    border: 2px solid #4a3427;
    border-radius: 8px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: bold;
    margin-top: 3px;
    white-space: nowrap;
  }
  .student-box.fainted .student-name {
    background: #ffd6d6;
    color: #c9184a;
    border-color: #c9184a;
  }

  /* Footer */
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 75px;
    background: #fff;
    border-top: 4px solid #ffccd5;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 20px;
    z-index: 50;
  }
  .btn-fart {
    background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
    color: white;
    border: none;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-app">
  <div class="header-bar">
    <div style="font-size: 20px; font-weight: bold; color: #e63946;">💨 ĐẠI TIỆC SHIN XÌ HƠI!</div>
    <div>ĐANG CHƠI: <b id="count-active">10</b> | ĐÃ XỈU: <b id="count-fainted">0</b></div>
  </div>

  <div class="status-banner" id="banner">🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!</div>

  <div class="stage" id="stage">
    <!-- Nhân vật Shin -->
    <div class="shin-box" onclick="triggerFart()">
      <img id="shin-sprite" class="shin-img" src="assets/shin_stand.png" alt="Shin">
      <div class="shin-tag">SHIN 🍮</div>
    </div>
  </div>

  <div class="footer-bar">
    <div>
      <span>SỐ BẠN NGẤT: </span>
      <input type="range" id="faint-range" min="1" max="5" value="3" oninput="document.getElementById('range-val').innerText = this.value">
      <b id="range-val" style="color: #c9184a;">3</b>
    </div>
    <button class="btn-fart" onclick="triggerFart()">💨 SHIN XÌ HƠI!</button>
    <button onclick="resetStage()" style="padding: 6px 14px; border-radius: 8px;">🔄 Gọi lại</button>
  </div>
</div>

<script>
  const studentNames = ["Hoàng Minh Châu", "Tạ Gia Hân", "Phan Đức Phúc", "Trịnh Thùy Linh", "Vũ Hoàng Long", "Phạm Tiến Đạt", "Hồng Hứa Thy", "Hoàng Nam", "Phương Vy", "Ngọc Diệp"];
  const stage = document.getElementById('stage');
  let students = [];

  function initStudents() {
    document.querySelectorAll('.student-box').forEach(e => e.remove());
    students = [];

    studentNames.forEach((name, i) => {
      const box = document.createElement('div');
      box.className = 'student-box running';
      box.innerHTML = `
        <img class="student-img" src="assets/student_${i % 4}.png" alt="${name}">
        <div class="student-name">${name}</div>
      `;

      let x = Math.random() * 500 + 40;
      let y = Math.random() * 150 + 100;
      box.style.left = x + 'px';
      box.style.bottom = y + 'px';

      stage.appendChild(box);
      students.push(box);
    });
    updateCounts();
  }

  function triggerFart() {
    const shinImg = document.getElementById('shin-sprite');
    shinImg.src = 'assets/shin_fart.gif'; // Đổi sang ảnh động chổng mông thả rắm

    document.getElementById('banner').innerText = '🏃‍♂️ CHẠY MAU! CÁC BẠN ĐANG CHẠY TRỐN KHẮP PHÒNG!';

    const activeList = students.filter(s => s.classList.contains('running'));
    if (!activeList.length) return alert('Tất cả đã xỉu rồi!');

    const count = parseInt(document.getElementById('faint-range').value);
    const chosen = activeList.sort(() => 0.5 - Math.random()).slice(0, count);

    chosen.forEach(s => {
      s.classList.remove('running');
      s.classList.add('fainted');
      s.querySelector('.student-img').src = 'assets/student_faint.png'; // Ảnh ngất mắt thôi miên
    });

    updateCounts();
  }

  function updateCounts() {
    document.getElementById('count-active').innerText = students.filter(s => s.classList.contains('running')).length;
    document.getElementById('count-fainted').innerText = students.filter(s => s.classList.contains('fainted')).length;
  }

  function resetStage() {
    document.getElementById('shin-sprite').src = 'assets/shin_stand.png';
    document.getElementById('banner').innerText = '🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!';
    initStudents();
  }

  window.onload = initStudents;
</script>
</body>
</html>
