<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐẠI TIỆC SHIN XÌ HƠI! - PAJAMA PARTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Mali:wght@700;900&display=swap');

  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

  body {
    background: #181920;
    font-family: 'Comfortaa', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* Khung chứa game chuẩn 16:9 */
  #game-app {
    width: 1060px;
    height: 596px;
    background: linear-gradient(180deg, #e3f8dc 0%, #c8ecc0 72%, #b2dfa6 100%);
    border: 8px solid #3d2616;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0,0,0,0.65);
  }

  /* Thanh tiêu đề trên cùng */
  .header-bar {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 74px;
    background: rgba(255, 255, 255, 0.96);
    border-bottom: 4px solid #ffccd5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 50;
  }
  .header-title-box h1 {
    font-size: 22px;
    color: #e63946;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title-box p {
    font-size: 11px;
    color: #666;
    margin-top: 2px;
  }
  .header-badges {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .badge {
    background: #fff;
    border: 2px solid #ffb3c1;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: bold;
    color: #4a3427;
    box-shadow: 0 3px 0 #ffccd5;
  }
  .badge b { color: #d90429; font-size: 15px; }

  .btn-ui {
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: transform 0.1s;
  }
  .btn-ui:active { transform: scale(0.95); }

  /* Băng rôn trạng thái giữa màn hình */
  .status-banner {
    position: absolute;
    top: 86px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8bd;
    border: 3px solid #f4a261;
    border-radius: 30px;
    padding: 7px 32px;
    font-size: 13px;
    font-weight: bold;
    color: #4a2800;
    box-shadow: 0 4px 0 #e76f51;
    z-index: 40;
    transition: all 0.3s;
    white-space: nowrap;
  }

  /* Cảnh vật trang trí phòng ngủ */
  .room-window {
    position: absolute;
    top: 88px;
    left: 115px;
    width: 215px;
    height: 185px;
    background: #141738;
    border: 10px solid #ffb5c5;
    border-bottom: 16px solid #ffb5c5;
    border-radius: 20px 20px 0 0;
    z-index: 2;
  }
  .room-window::before {
    content: '';
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 6px; background: #ffb5c5;
    transform: translateY(-50%);
  }
  .room-window::after {
    content: '';
    position: absolute;
    left: 50%; top: 0; width: 6px; height: 100%; background: #ffb5c5;
    transform: translateX(-50%);
  }
  .window-moon {
    position: absolute;
    top: 18px;
    right: 28px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    box-shadow: 10px 10px 0 0 #ffeb3b;
  }

  .aquarium {
    position: absolute;
    bottom: 125px;
    left: 35px;
    width: 165px;
    height: 105px;
    background: linear-gradient(180deg, rgba(162, 222, 255, 0.85) 0%, rgba(68, 172, 238, 0.92) 100%);
    border: 5px solid #dcdcdc;
    border-radius: 12px;
    z-index: 3;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
  }

  .tent-shelter {
    position: absolute;
    bottom: 105px;
    right: 25px;
    width: 155px;
    height: 185px;
    background: #f7d070;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    border-left: 12px solid #dfa838;
    z-index: 3;
  }
  .tent-door {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 52px;
    height: 70px;
    background: #6e4719;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  /* Sân khấu nhân vật */
  .room-stage {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* Canvas khói xì hơi */
  #smoke-canvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 15;
    pointer-events: none;
  }

  /* Nhân vật Shin Cậu Bé Bút Chì */
  .shin-wrapper {
    position: absolute;
    bottom: 120px;
    left: 575px;
    width: 165px;
    height: 160px;
    z-index: 22;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .shin-wrapper:hover { transform: scale(1.04); }
  .shin-tag {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffeb3b;
    border: 2.5px solid #4a2c11;
    border-radius: 12px;
    padding: 2px 16px;
    font-size: 12px;
    font-weight: bold;
    color: #3d220a;
    white-space: nowrap;
    box-shadow: 0 3px 0 #4a2c11;
  }

  /* Hoạt ảnh Shin lắc mông xì hơi cực nhộn */
  @keyframes buttWiggle {
    0% { transform: translateX(0) rotate(0deg) scale(1); }
    20% { transform: translateX(8px) rotate(5deg) scale(1.08, 0.94); }
    40% { transform: translateX(-8px) rotate(-5deg) scale(0.95, 1.06); }
    60% { transform: translateX(6px) rotate(4deg) scale(1.06, 0.96); }
    80% { transform: translateX(-4px) rotate(-2deg) scale(1.02, 0.98); }
    100% { transform: translateX(0) rotate(0deg) scale(1); }
  }
  .shin-farting {
    animation: buttWiggle 0.45s infinite ease-in-out;
  }

  /* Chữ hoạt hình BỤP! XỲYYY! */
  .fart-comic-text {
    position: absolute;
    bottom: 245px;
    left: 610px;
    font-family: 'Mali', cursive;
    font-size: 38px;
    font-weight: 900;
    color: #38b000;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 5px 5px 0 #1b4332;
    z-index: 60;
    pointer-events: none;
    animation: comicPop 0.9s forwards ease-out;
    white-space: nowrap;
  }
  @keyframes comicPop {
    0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    50% { transform: scale(1.3) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg) translateY(-35px); opacity: 0; }
  }

  /* Học sinh chạy trốn & ngất xỉu */
  .student-item {
    position: absolute;
    width: 96px;
    height: 128px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transition: left 0.7s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 18;
    pointer-events: auto;
  }

  /* Hoạt ảnh chạy nhảy sống động */
  @keyframes runPanic {
    0% { transform: translateY(0) rotate(-7deg); }
    50% { transform: translateY(-13px) rotate(7deg) scaleY(1.04); }
    100% { transform: translateY(0) rotate(-7deg); }
  }
  .student-item.running .char-svg {
    animation: runPanic 0.26s infinite ease-in-out;
  }

  /* Ngất xỉu nằm bẹp ra đất */
  .student-item.fainted {
    transform: rotate(86deg) translateY(24px) !important;
    transition: transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 12 !important;
  }
  .student-item.fainted .char-svg {
    animation: none !important;
    filter: drop-shadow(0 0 8px rgba(118, 186, 0, 0.7));
  }

  .student-tag {
    background: #fff;
    border: 2px solid #3d2616;
    border-radius: 8px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: bold;
    color: #222;
    white-space: nowrap;
    margin-top: 2px;
    box-shadow: 0 2px 0 #3d2616;
  }
  .student-item.fainted .student-tag {
    background: #ffd6d6;
    border-color: #c9184a;
    color: #c9184a;
  }

  /* Bóng thoại kêu la */
  .chat-bubble {
    position: absolute;
    top: -24px;
    background: #fff;
    border: 2px solid #222;
    border-radius: 8px;
    padding: 2px 7px;
    font-size: 9px;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    z-index: 30;
  }
  .chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    border-width: 5px 5px 0;
    border-style: solid;
    border-color: #fff transparent;
  }

  /* Vòng xoáy thôi miên liên tục xoay */
  @keyframes hypnoSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .hypno-eye {
    transform-origin: center;
    animation: hypnoSpin 0.4s infinite linear;
  }

  /* Thanh điều khiển dưới cùng */
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 82px;
    background: #fff;
    border-top: 4px solid #ffccd5;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 24px;
    z-index: 50;
  }
  .slider-box {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: bold;
    color: #4a3427;
  }
  .slider-num {
    background: #fff0f3;
    border: 2px solid #ff4d6d;
    color: #c9184a;
    padding: 3px 12px;
    border-radius: 8px;
    font-size: 18px;
    min-width: 38px;
    text-align: center;
  }

  .btn-fart-action {
    background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
    color: white;
    border: none;
    padding: 13px 42px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    box-shadow: 0 6px 0 #800f2f;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.1s;
  }
  .btn-fart-action:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #800f2f;
  }

  /* Popup cài đặt danh sách */
  .modal-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .modal-box {
    background: #fff;
    padding: 24px;
    border-radius: 20px;
    width: 440px;
    text-align: center;
    border: 5px solid #4a3427;
  }
  .modal-box textarea {
    width: 100%;
    height: 160px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #ccc;
    font-family: inherit;
    margin: 12px 0;
  }
</style>
</head>
<body>

<div id="game-app">
  <!-- Cảnh nền -->
  <div class="room-window"><div class="window-moon"></div></div>
  <div class="aquarium">🐠 🌿</div>
  <div class="tent-shelter"><div class="tent-door"></div></div>

  <!-- Header -->
  <div class="header-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 30px;">💨</span>
      <div class="header-title-box">
        <h1>ĐẠI TIỆC SHIN XÌ HƠI!</h1>
        <p>Shin rủ cả lớp dự tiệc... nhưng ai sẽ bị mùi thúi bắt kịp?</p>
      </div>
      <button class="btn-ui" onclick="openStudentModal()" style="margin-left: 10px; color: #2b9348;">📝 Đổi Danh Sách HS</button>
    </div>
    <div class="header-badges">
      <div class="badge">ĐANG CHƠI: <b id="count-playing">10</b></div>
      <div class="badge">ĐÃ GỌI: <b id="count-fainted">0</b></div>
      <button class="btn-ui" onclick="toggleAudio()" id="btn-sound">🔊</button>
    </div>
  </div>

  <!-- Băng rôn trạng thái -->
  <div class="status-banner" id="status-banner">
    🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!
  </div>

  <!-- Màn khói canvas -->
  <canvas id="smoke-canvas"></canvas>

  <!-- Sân khấu chính chứa nhân vật -->
  <div class="room-stage" id="room-stage">

    <!-- CẬU BÉ SHIN BÚT CHÌ -->
    <div class="shin-wrapper" id="shin-boy" onclick="triggerFartEvent()">
      
      <!-- TRẠNG THÁI 1: SHIN ĐỨNG HỚN HỞ ĂN BÁNH (Áo đỏ quần vàng chuẩn bản gốc) -->
      <svg id="shin-stand" viewBox="0 0 150 150" width="100%" height="100%">
        <!-- Chân & Giày vàng tất trắng -->
        <path d="M 58,112 L 55,128" stroke="#f5b895" stroke-width="8" stroke-linecap="round"/>
        <path d="M 58,112 L 55,128" stroke="#222" stroke-width="2.5" fill="none"/>
        <rect x="51" y="122" width="8" height="6" fill="#fff" stroke="#222" stroke-width="2"/>
        <ellipse cx="53" cy="131" rx="10" ry="4.5" fill="#ffd600" stroke="#222" stroke-width="2.2"/>

        <path d="M 88,112 L 91,128" stroke="#f5b895" stroke-width="8" stroke-linecap="round"/>
        <path d="M 88,112 L 91,128" stroke="#222" stroke-width="2.5" fill="none"/>
        <rect x="87" y="122" width="8" height="6" fill="#fff" stroke="#222" stroke-width="2"/>
        <ellipse cx="93" cy="131" rx="10" ry="4.5" fill="#ffd600" stroke="#222" stroke-width="2.2"/>

        <!-- Quần soóc vàng -->
        <path d="M 46,92 L 100,92 L 104,114 L 78,114 L 73,104 L 68,114 L 42,114 Z" fill="#fff176" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Áo thun đỏ tươi -->
        <path d="M 44,64 Q 73,60 102,64 L 106,94 L 40,94 Z" fill="#e53935" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 44,64 L 30,78 L 38,85 L 46,74 Z" fill="#e53935" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 102,64 L 116,78 L 108,85 L 100,74 Z" fill="#e53935" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Khuôn mặt hạt đậu phúng phính chuẩn 100% anime -->
        <path d="M 42,40 C 18,40 16,68 40,70 C 56,72 78,70 96,66 C 112,62 110,36 94,30 C 82,16 50,18 42,40 Z" fill="#f5b895" stroke="#222" stroke-width="2.6"/>
        <!-- Tai -->
        <path d="M 94,44 C 106,40 108,60 94,60" fill="#f5b895" stroke="#222" stroke-width="2.5"/>

        <!-- Tóc húi cua đen -->
        <path d="M 44,34 C 52,18 86,18 96,34 C 98,38 98,44 96,46 C 94,34 82,26 64,26 C 52,26 46,30 44,34 Z" fill="#1a1a1a"/>

        <!-- Lông mày sâu róm bản to hình chữ V ngược -->
        <path d="M 44,28 Q 53,19 62,28" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 70,27 Q 79,18 88,27" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>

        <!-- Mắt to đen có tròng trắng ở giữa giống hệt ảnh -->
        <ellipse cx="54" cy="42" rx="7.5" ry="8" fill="#111"/>
        <circle cx="54" cy="42" r="3" fill="#fff"/>
        <ellipse cx="76" cy="42" rx="7.5" ry="8" fill="#111"/>
        <circle cx="76" cy="42" r="3" fill="#fff"/>

        <!-- Miệng cười ăn bánh -->
        <ellipse cx="62" cy="58" rx="4.5" ry="6" fill="#c62828" stroke="#222" stroke-width="2"/>

        <!-- Tay cầm đĩa bánh Chocobi -->
        <ellipse cx="118" cy="82" rx="16" ry="5" fill="#fff" stroke="#222" stroke-width="2"/>
        <circle cx="118" cy="77" r="7" fill="#6d4c41" stroke="#222" stroke-width="1.8"/>
      </svg>

      <!-- TRẠNG THÁI 2: SHIN TỤT QUẦN VÀNG CHỔNG MÔNG (ĐỒ LẠI Y HỆT 100% ẢNH EM GỬI) -->
      <svg id="shin-fart" viewBox="0 0 180 155" width="100%" height="100%" style="display:none;">
        <!-- Chân trái & tất trắng + giày vàng chống đất -->
        <path d="M 88,118 L 106,125 L 116,138" stroke="#f5b895" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M 88,118 L 106,125 L 116,138" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="103,122 114,128 110,134 99,128" fill="#ffffff" stroke="#222" stroke-width="2"/>
        <path d="M 112,128 L 123,142 C 120,145 112,140 108,133 Z" fill="#ffd600" stroke="#222" stroke-width="2.2"/>

        <!-- Chân phải & tất trắng + giày vàng phía sau -->
        <path d="M 122,110 L 136,118 L 145,130" stroke="#f5b895" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M 122,110 L 136,118 L 145,130" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="132,114 142,120 138,126 128,120" fill="#ffffff" stroke="#222" stroke-width="2"/>
        <path d="M 140,119 L 150,133 C 146,136 139,131 136,125 Z" fill="#ffd600" stroke="#222" stroke-width="2.2"/>

        <!-- Áo đỏ khom lưng & tay trái nắm拳 chống xuống -->
        <path d="M 55,74 L 38,94 L 46,105 L 62,92 L 85,108 L 116,74 Q 90,62 55,74 Z" fill="#e53935" stroke="#222" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- Bàn tay trái nắm tròn -->
        <circle cx="35" cy="88" r="6.5" fill="#f5b895" stroke="#222" stroke-width="2.4"/>

        <!-- Quần đùi vàng tụt xuống dưới mông (có nếp gấp y hệt ảnh) -->
        <path d="M 80,104 C 95,108 130,100 148,90 L 146,110 C 128,118 102,122 83,120 Z" fill="#fff176" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 115,105 L 112,114 M 126,102 L 134,108" stroke="#222" stroke-width="2" stroke-linecap="round"/>

        <!-- CẶP MÔNG TRÒN CĂNG CHỔNG LÊN TRỜI (2 quả đào căng phồng chuẩn ảnh mẫu) -->
        <!-- Mông bên phải (xa hơn) -->
        <path d="M 105,74 C 122,56 155,66 152,90 C 150,102 135,106 118,104" fill="#f5b895" stroke="#222" stroke-width="2.6" stroke-linecap="round"/>
        <!-- Mông bên trái (gần hơn, đè lên mông phải tạo rãnh mông chuẩn) -->
        <path d="M 80,105 C 74,78 106,64 122,82 C 130,92 126,105 112,108 C 98,110 84,108 80,105 Z" fill="#f5b895" stroke="#222" stroke-width="2.6" stroke-linejoin="round"/>

        <!-- ĐẦU SHIN NGOÁI LẠI NHÌN (Má phính trái, tai phải, miệng nhe răng trắng) -->
        <path d="M 38,44 C 14,44 12,74 38,76 C 54,78 76,76 92,70 C 102,66 100,38 86,32 C 74,18 46,20 38,44 Z" fill="#f5b895" stroke="#222" stroke-width="2.6"/>
        <!-- Tai phải -->
        <path d="M 88,46 C 102,42 104,64 88,64" fill="#f5b895" stroke="#222" stroke-width="2.6"/>

        <!-- Tóc đen ôm sát đỉnh đầu tới mang tai -->
        <path d="M 40,36 C 48,18 82,18 92,36 C 95,41 94,47 91,48 C 88,36 76,27 58,27 C 47,27 42,31 40,36 Z" fill="#141414"/>

        <!-- Cặp lông mày sâu róm cong vút -->
        <path d="M 40,31 Q 49,20 58,30" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 65,30 Q 75,19 84,30" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>

        <!-- Đôi mắt đen to tròn với tròng trắng đồng tâm đúng chuẩn ảnh chụp -->
        <ellipse cx="49" cy="45" rx="7.5" ry="8" fill="#111"/>
        <circle cx="49" cy="45" r="3" fill="#ffffff"/>
        <ellipse cx="70" cy="45" rx="7.5" ry="8" fill="#111"/>
        <circle cx="70" cy="45" r="3" fill="#ffffff"/>

        <!-- Khuôn miệng nhe răng trắng tinh nghịch ở góc má trái y hệt ảnh -->
        <path d="M 32,67 C 37,63 48,64 50,68 C 46,72 35,71 32,67 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
      </svg>

      <div class="shin-tag">SHIN 🍮</div>
    </div>

  </div>

  <!-- Điều khiển dưới cùng -->
  <div class="footer-bar">
    <div class="slider-box">

  /* Âm thanh hoạt hình Web Audio API */
  function playAudioEffect(type) {
    if (!soundEnabled) return;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (type === 'fart') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(145, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(32, audioCtx.currentTime + 0.65);
        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.7);
      } else if (type === 'faint') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(75, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    } catch(e){}
  }

  function toggleAudio() {
    soundEnabled = !soundEnabled;
    document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
  }

  /* Khói rắm độc màu xanh bay mù mịt từ đúng vị trí mông Shin */
  let smokeParticles = [];
  class Smoke {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.65) * 7;
      this.vy = (Math.random() - 0.55) * 4.5;
      this.size = Math.random() * 26 + 18;
      this.alpha = 0.85;
      this.color = Math.random() > 0.5 ? 'rgba(118, 186, 0, ' : 'rgba(167, 219, 78, ';
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.size += 0.85;
      this.alpha -= 0.012;
    }
    draw() {
      ctx.fillStyle = this.color + this.alpha + ')';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function renderSmokeLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      smokeParticles[i].update();
      if (smokeParticles[i].alpha <= 0) {
        smokeParticles.splice(i, 1);
      } else {
        smokeParticles[i].draw();
      }
    }
    requestAnimationFrame(renderSmokeLoop);
  }
  requestAnimationFrame(renderSmokeLoop);

  /* Di chuyển chạy nhảy tự động khắp phòng */
  let moveInterval = null;
  function startRunningChaos() {
    if (moveInterval) clearInterval(moveInterval);
    moveInterval = setInterval(() => {
      const activeKids = document.querySelectorAll('.student-item.running');
      activeKids.forEach(kid => {
        let curLeft = parseFloat(kid.style.left);
        let curBottom = parseFloat(kid.style.bottom);

        let dx = (Math.random() - 0.5) * 175;
        let dy = (Math.random() - 0.5) * 75;

        let newX = Math.max(35, Math.min(930, curLeft + dx));
        let newY = Math.max(105, Math.min(265, curBottom + dy));

        if (newX > 520 && newX < 755) {
          newX = newX > 635 ? 770 : 500;
        }

        kid.style.left = `${newX}px`;
        kid.style.bottom = `${newY}px`;

        const bubble = kid.querySelector('.chat-bubble');
        if (Math.random() > 0.65) {
          bubble.innerText = '🏃‍♂️ CHẠY MAU!';
          bubble.style.display = 'block';
          setTimeout(() => {
            if (kid.classList.contains('running')) bubble.style.display = 'none';
          }, 1200);
        }
      });
    }, 1050);
  }

  /* KÍCH HOẠT SHIN TỤT QUẦN THẢ RẤM & BẮT HỌC SINH NGẤT XỈU */
  function triggerFartEvent() {
    playAudioEffect('fart');

    const shin = document.getElementById('shin-boy');
    document.getElementById('shin-stand').style.display = 'none';
    document.getElementById('shin-fart').style.display = 'block';
    shin.classList.add('shin-farting');

    const comicText = document.createElement('div');
    comicText.className = 'fart-comic-text';
    comicText.innerText = 'BỤP! XỲYYY! 💨';
    roomStage.appendChild(comicText);
    setTimeout(() => comicText.remove(), 900);

    // Phun khói xanh từ đúng khe mông Shin
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        smokeParticles.push(new Smoke(685, 415));
      }, i * 10);
    }

    banner.innerText = '🏃‍♂️ CHẠY MAU! CÁC BẠN ĐANG CHẠY TRỐN KHẮP PHÒNG!';
    banner.style.background = '#ffd166';
    mainBtn.innerText = '🤢 ĐANG CHẠY TRỐN... (THẢ TIẾP!) 💨';

    const activeKids = Array.from(document.querySelectorAll('.student-item.running'));
    if (activeKids.length === 0) {
      alert("Tất cả các bạn đã ngất xỉu rồi! Hãy nhấn 'Gọi lại từ đầu' nhé!");
      return;
    }

    const numToFaint = parseInt(document.getElementById('faint-range').value);
    const chosenKids = activeKids.sort(() => 0.5 - Math.random()).slice(0, numToFaint);

    chosenKids.forEach((kid, idx) => {
      setTimeout(() => {
        kid.classList.remove('running');
        kid.classList.add('fainted');

        // Đổi mắt sang hiệu ứng xoáy thôi miên xoay tròn
        const tplIdx = parseInt(kid.getAttribute('data-tpl'));
        const tpl = studentTemplates[tplIdx];
        const eyeL = kid.querySelector('.eye-l');
        const eyeR = kid.querySelector('.eye-r');

        if (eyeL && eyeR) {
          const hypnoSvg = `
            <g class="hypno-eye">
              <circle cx="0" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
              <path d="M 0,0 Q 2.5,-3.5 4.5,0 Q 2.5,3.5 -2,2 Q -4,-2 0,-4" stroke="#111" stroke-width="1.6" fill="none"/>
            </g>
          `;
          eyeL.outerHTML = `<g transform="translate(${tpl.eyeLPos.x}, ${tpl.eyeLPos.y})">${hypnoSvg}</g>`;
          eyeR.outerHTML = `<g transform="translate(${tpl.eyeRPos.x}, ${tpl.eyeRPos.y})">${hypnoSvg}</g>`;
        }

        const bubble = kid.querySelector('.chat-bubble');
        bubble.innerText = '😵 Thúi quá... ngất xỉu!';
        bubble.style.display = 'block';

        playAudioEffect('faint');
        updateCounters();

        if (idx === chosenKids.length - 1) {
          banner.innerText = '😵 Á À! TỪNG BẠN ĐÃ BỊ MÙI THÚI BẮT KỊP!';
        }
      }, idx * 420);
    });
  }

  function updateCounters() {
    const playing = document.querySelectorAll('.student-item.running').length;
    const fainted = document.querySelectorAll('.student-item.fainted').length;
    document.getElementById('count-playing').innerText = playing;
    document.getElementById('count-fainted').innerText = fainted;
  }

  function initializeStudents() {
    const existing = document.querySelectorAll('.student-item');
    existing.forEach(e => e.remove());

    const namesInput = document.getElementById('student-names-input').value;
    students = namesInput.split('\n').filter(n => n.trim() !== '');

    students.forEach((name, i) => {
      const kid = document.createElement('div');
      kid.className = 'student-item running';
      kid.id = `kid-${i}`;

      const tplIdx = i % studentTemplates.length;
      kid.setAttribute('data-tpl', tplIdx);
      const tpl = studentTemplates[tplIdx];

      kid.innerHTML = `
        <div class="chat-bubble" style="display:none;"></div>
        ${tpl.svg}
        <div class="student-tag">${name}</div>
      `;

      let startX, startY;
      do {
        startX = Math.random() * 860 + 40;
        startY = Math.random() * 150 + 105;
      } while (startX > 520 && startX < 755);

      kid.style.left = `${startX}px`;
      kid.style.bottom = `${startY}px`;

      roomStage.appendChild(kid);
    });

    updateCounters();
    startRunningChaos();
  }

  function resetGameStage() {
    banner.innerText = '🍰 Các bạn đang thưởng thức bánh ngọt tại tiệc ngủ!';
    banner.style.background = '#fff8bd';
    mainBtn.innerText = '💨 SHIN XÌ HƠI! 🤢';
    const shin = document.getElementById('shin-boy');
    shin.classList.remove('shin-farting');
    document.getElementById('shin-stand').style.display = 'block';
    document.getElementById('shin-fart').style.display = 'none';
    initializeStudents();
  }

  function openStudentModal() {
    document.getElementById('name-modal').style.display = 'flex';
  }

  function saveStudentNames() {
    document.getElementById('name-modal').style.display = 'none';
    resetGameStage();
  }

  window.onload = () => {
    initializeStudents();
  };
</script>
